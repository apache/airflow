---
# Run independently of the quick-start Compose file so its credentials are not inherited.
services:
  dag-processor:
    image: ${AIRFLOW_IMAGE_NAME:?Set an Airflow image with processor API support}
    command: [dag-processor]
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      USER: airflow
      AIRFLOW_CONFIG: /tmp/airflow.cfg
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
      AIRFLOW__DAG_PROCESSOR__EXECUTION_API_TOKEN_FILE: /run/dag-processor/processor.jwt
      AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_STORAGE_PATH: /tmp/dag-bundles
      AIRFLOW__DAG_PROCESSOR__HEALTH_CHECK_FILE: /tmp/dag-processor-health.json
      CONNECTION_CHECK_MAX_COUNT: "0"
    volumes:
      - ./tokens:/run/dag-processor:ro
      - ./dags:/opt/airflow/dags:ro
      - ./logs:/opt/airflow/logs
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, airflow, dag-processor, --check-health]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    networks: [processor-api]
    restart: unless-stopped
networks:
  processor-api:
    name: ${DAG_PROCESSOR_API_NETWORK:-dag-processor-api}
    external: true
