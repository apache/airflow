---
apiVersion: v1
kind: Namespace
metadata:
  name: airflow-dag-processor
---
# Omit data/stringData so applying this manifest again preserves the current session.
apiVersion: v1
kind: Secret
metadata:
  name: dag-processor-session
  namespace: airflow-dag-processor
type: Opaque
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dag-processor-token-provisioner
  namespace: airflow
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dag-processor-token-provisioner
  namespace: airflow-dag-processor
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [dag-processor-session]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dag-processor-token-provisioner
  namespace: airflow-dag-processor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dag-processor-token-provisioner
subjects:
  - kind: ServiceAccount
    name: dag-processor-token-provisioner
    namespace: airflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dag-processor-token-provisioner
  namespace: airflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      component: dag-processor-token-provisioner
  template:
    metadata:
      labels:
        component: dag-processor-token-provisioner
    spec:
      serviceAccountName: dag-processor-token-provisioner
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: token-provisioner
          # Use an image containing the Kubernetes token provisioner command.
          image: apache/airflow:3.5.0
          args:
            - airflow
            - dag-processor-token
            - --kubernetes-secret
            - dag-processor-session
            - --kubernetes-namespace
            - airflow-dag-processor
            - --bundle-name
            - dags-folder
            - --valid-for
            - "600"
            - --rotate
          env:
            - name: AIRFLOW_HOME
              value: /tmp/airflow
            - name: AIRFLOW_CONFIG
              value: /dev/null
            - name: AIRFLOW__CORE__LOAD_EXAMPLES
              value: "False"
            - name: CONNECTION_CHECK_MAX_COUNT
              value: "0"
            - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST
              value: >-
                [{"name":"dags-folder",
                  "classpath":"airflow.dag_processing.bundles.local.LocalDagBundle","kwargs":{}}]
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef:
                  # Match the trusted API server's jwtSecretName (default: <release>-jwt-secret).
                  name: airflow-jwt-secret
                  key: jwt-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
