---
# Install as a separate processor-only release in airflow-dag-processor.
# Apply kubernetes-token-provisioner.yaml first, using an image with API mode.
airflowVersion: "3.5.0"
defaultAirflowTag: "3.5.0"
executor: LocalExecutor
scheduler:
  enabled: false
apiServer:
  enabled: false
triggerer:
  enabled: false
createUserJob:
  enabled: false
migrateDatabaseJob:
  enabled: false
postgresql:
  enabled: false
redis:
  enabled: false
statsd:
  enabled: false
rbac:
  create: false
enableBuiltInSecretEnvVars:
  AIRFLOW__CORE__FERNET_KEY: false
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: false
  AIRFLOW_CONN_AIRFLOW_DB: false
  AIRFLOW__API__SECRET_KEY: false
  AIRFLOW__API_AUTH__JWT_SECRET: false
  AIRFLOW__CELERY__RESULT_BACKEND: false
  AIRFLOW__CELERY__BROKER_URL: false
config:
  core:
    execution_api_server_url: http://airflow-api-server.airflow.svc.cluster.local:8080/execution/
  dag_processor:
    execution_api_token_file: /run/dag-processor/processor.jwt
dagProcessor:
  replicas: 1
  waitForMigrations:
    enabled: false
  serviceAccount:
    automountServiceAccountToken: false
  env:
    - name: CONNECTION_CHECK_MAX_COUNT
      value: "0"
  extraVolumes:
    - name: processor-token
      secret:
        secretName: dag-processor-session
        defaultMode: 0440
  extraVolumeMounts:
    - name: processor-token
      mountPath: /run/dag-processor
      readOnly: true
dags:
  persistence:
    enabled: true
    existingClaim: processor-dags
