---
sdk: java

min_airflow_version: "3.4.0"

# Keep in sync with airflowSupervisorSchemaVersion in gradle.properties, which is what stamps the
# JAR manifest. The render hook fails if the two disagree.
supervisor_schema_version: "2026-10-30"

# The runtime terminates a task with SucceedTask, RetryTask, DeferTask, or TaskState
# (failed/skipped/removed); it does not yet emit RescheduleTask or AwaitInputTask.
states:
  success:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  failed:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  up_for_retry:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "RetryTask"
  skipped:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "a TriggerDagRun task that skips an existing run"
  deferred:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "a TriggerDagRun task that waits with deferrable"
  up_for_reschedule:
    supported: false
    note: "runtime does not emit RescheduleTask yet"
  awaiting_input:
    supported: false
    note: "runtime does not emit AwaitInputTask yet"
  removed:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"

# Runtime capabilities apply to a task body in both authoring modes.
capabilities:
  task-logging:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "SLF4J + JPL bridged to the task log"
  xcom-read-write:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  connection-read:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  variable-read-write:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  self-contained-bundle:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "Airflow metadata embedded in the jar artifact"
  retry-policy:
    supported: false
    note: "no task-facing retry-policy API yet"
  task-state-store:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "Client.getTaskStateStore() get/set/delete/clear"
  asset-state-store:
    supported: false
    note: "no task-facing asset state-store API yet"
  asset-event-emit:
    supported: false
    note: "runtime does not emit asset events yet"
  asset-event-read:
    supported: false
    note: "no task-facing asset-event API yet"
  object-store:
    supported: false
    note: "no object-storage API yet"
  listeners:
    supported: false
    note: "no hook into the Python listener API, so a task emits no OpenLineage facets of its own"
  # Dag definition: the whole Dag is declared in the SDK's language.
  dag-definition-authoring:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  dag-args:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  task-args:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  dag-params:
    supported: false
  dag-callbacks:
    supported: false
  explicit-dependencies:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "before / after, or @Airflow.Deps"
  edge-labels:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "Label.of(text).on(task)"
  taskflow-dependencies:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  task-group:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  task-loops:
    supported: false
  if-else-branching:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "DagDef.If or @Airflow.If"
  switch-case-branching:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "DagDef.Switch or @Airflow.Switch"
  trigger-dag-run:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "TriggerDagRun"
  dynamic-dag-generation:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
  human-in-the-loop:
    supported: false
  dag-test:
    supported: false
  asset-definition:
    supported: false
  asset-scheduling:
    supported: false
  # Python Dag with stub TaskHandler.
  mixed-lang-stub-target:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "@task.stub"
  taskflow-binding:
    supported: true
    since: "3.4.0"
    sdk_version: "1.0.0"
    note: "mapped stubs excluded"
  # Shared by both authoring modes, so declared once per mode.
  mapped-tasks:
    dag-definition:
      supported: false
    stub-task-handler:
      supported: false
      note: "Airflow does not bind arguments to mapped stubs yet"
  asset-inlets-outlets:
    dag-definition:
      supported: false
    stub-task-handler:
      supported: false
      note: "runtime does not report task outlets yet"
  task-callbacks:
    dag-definition:
      supported: false
      note: "no SDK-defined task callbacks"
    stub-task-handler:
      supported: false
      note: "a Python-declared task callback does not run for a stub task"
