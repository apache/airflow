---
services:
  airflow:
    # Kept out of local.yml so that it can be skipped: `uv sync` rewrites uv.lock in place, and
    # with --force-lowest-dependencies it re-resolves the whole graph, so mounting the host file
    # would silently replace the contributor's lock with a lowest-direct resolution. Without the
    # mount the container falls back to the uv.lock baked into the CI image and writes there.
    volumes:
      - type: bind
        source: ../../../uv.lock
        target: /opt/airflow/uv.lock
