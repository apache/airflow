# In-memory persistence, bootstrap root credentials and FILE storage, as in apache/polaris'
# client/python/docker-compose.yml.
---
services:
  polaris:
    image: apache/polaris:1.9.0
    labels:
      org.apache.airflow.breeze: "true"
      org.apache.airflow.breeze.worktree: "${BREEZE_WORKTREE_PATH:-}"
      org.apache.airflow.breeze.host: "${BREEZE_HOST_ID:-}"
      breeze.description: "Integration required for Apache Polaris tests."
    environment:
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.log.file.enabled: "false"
      quarkus.otel.sdk.disabled: "true"
      polaris.features."DROP_WITH_PURGE_ENABLED": "true"
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"FILE\",\"S3\",\"GCS\",\"AZURE\"]"
      polaris.readiness.ignore-severe-issues: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: "on-failure"

  airflow:
    environment:
      - INTEGRATION_POLARIS=true
    depends_on:
      polaris:
        condition: service_healthy
