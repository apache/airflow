---
# The Dags compare.py checks a language SDK's serializer on. serialize_python.py and the SDK's own
# serializer each build every Dag here with their SDK's authoring API, and the two serializations
# have to agree.
#
# `spec` keys are the serialized Dag schema's snake_case names, which each side maps onto
# its authoring API. A task is called with the tasks named in its `upstream`, which come
# before it. Task and group ids are fully qualified, and a group comes after its parent.
# `order_edges` are `[upstream, downstream]` pairs of task or group ids.
#
# `!datetime` takes an ISO 8601 timestamp, and `!timedelta` a number of seconds.
dags:
  # No schedule and no options: NullTimetable plus the fields Python always emits.
  - dag_id: conformance_minimal
    tasks:
      - task_id: solo

  # A cron schedule with every Dag option set, and one fully configured task followed by
  # one left entirely at its schema defaults.
  - dag_id: conformance_cron
    spec:
      schedule: "0 3 * * *"
      description: a Dag that sets everything
      dag_display_name: Conformance Cron
      doc_md: "# notes"
      tags: [gamma, alpha, gamma]
      start_date: !datetime 2026-01-01T00:00:00+00:00
      end_date: !datetime 2026-12-31T23:30:15+00:00
      dagrun_timeout: !timedelta 300
      catchup: true
      render_template_as_native_obj: true
      disable_bundle_versioning: true
      is_paused_upon_creation: true
      max_active_tasks: 8
      max_active_runs: 3
      max_consecutive_failed_dag_runs: 2
    tasks:
      - task_id: extract
        spec:
          owner: data-team
          start_date: !datetime 2026-02-01T00:00:00+00:00
          end_date: !datetime 2026-11-30T00:00:00+00:00
          trigger_rule: all_done
          depends_on_past: true
          ignore_first_depends_on_past: true
          wait_for_past_depends_before_skipping: true
          wait_for_downstream: true
          retries: 2
          queue: typescript
          pool: tiny
          pool_slots: 2
          execution_timeout: !timedelta 120
          retry_delay: !timedelta 600
          retry_exponential_backoff: 2
          max_retry_delay: !timedelta 900
          priority_weight: 5
          weight_rule: upstream
          executor: LocalExecutor
          do_xcom_push: false
          email_on_failure: false
          email_on_retry: false
          doc_md: extracts things
          map_index_template: "{{ task.task_id }}"
          max_active_tis_per_dag: 3
          max_active_tis_per_dagrun: 4
      # Every value explicitly at its schema default, so all of them are omitted.
      - task_id: transform
        upstream: [extract]
        spec:
          owner: airflow
          trigger_rule: all_success
          depends_on_past: false
          ignore_first_depends_on_past: false
          wait_for_past_depends_before_skipping: false
          wait_for_downstream: false
          retries: 0
          queue: default
          pool: default_pool
          pool_slots: 1
          retry_delay: !timedelta 300
          retry_exponential_backoff: 0
          priority_weight: 1
          weight_rule: downstream
          do_xcom_push: true
          email_on_failure: true
          email_on_retry: true

  # The @once preset, fail_fast, and a task feeding two downstreams. fail_fast is set here
  # rather than on conformance_cron, since Airflow only allows it when every task uses the
  # all_success trigger rule.
  - dag_id: conformance_once
    spec:
      schedule: "@once"
      fail_fast: true
    tasks:
      - task_id: seed
      - task_id: beta
        upstream: [seed]
      - task_id: alpha
        upstream: [seed]

  # The @continuous preset. Airflow caps a continuous Dag at one active run, so
  # max_active_runs is set rather than left at the default of 16.
  - dag_id: conformance_continuous
    spec:
      schedule: "@continuous"
      max_active_runs: 1
    tasks:
      - task_id: watch

  # Fan-out and fan-in, so downstream_task_ids has to be sorted rather than kept in wiring
  # order. The schedule is not written "@daily" because Python expands a preset before
  # serializing it, which serde.test.ts covers separately.
  - dag_id: conformance_diamond
    spec:
      schedule: "0 0 * * *"
    tasks:
      - task_id: root
      - task_id: right
        upstream: [root]
      - task_id: left
        upstream: [root]
      - task_id: join
        upstream: [right, left]

  # Nested task groups and order-only edges. A group edge is recorded on the group, and is
  # also expanded onto the task graph, where it reaches the group's roots and leaves
  # rather than every task it holds: staging.stage feeds staging.checks.nulls, so only
  # the latter is a leaf. Both sides have to agree on that expansion, and on the local
  # _group_id a nested group carries.
  - dag_id: conformance_groups
    spec:
      schedule: "@once"
    groups: [staging, staging.checks, publish]
    tasks:
      - task_id: extract
      - task_id: stage
        group: staging
      - task_id: nulls
        group: staging.checks
        upstream: [staging.stage]
      - task_id: push
        group: publish
      - task_id: load
      - task_id: notify
    order_edges:
      - [extract, staging]
      - [staging, publish]
      - [publish, load]
      - [load, notify]

  # Group edges whose ends sit inside another group, which is where the two ways of resolving a
  # group's endpoints part company. Each edge has to be expanded against the task edges the ones
  # before it left behind, as Python does at every `>>`:
  #
  # - outer.inner before outer.t makes outer.inner.i the only root of outer, so the edge from
  #   extract into outer reaches it alone rather than both tasks.
  # - outer.spare holds nothing, so an edge out of it stands for the group holding it, and leaves
  #   from outer's leaf, which is outer.t by then. Python's find_leaves walks up to the parent;
  #   stopping at the group's own edges would draw no edge at all.
  - dag_id: conformance_nested_group_edges
    spec:
      schedule: "@once"
    groups: [outer, outer.inner, outer.spare]
    tasks:
      - task_id: extract
      - task_id: t
        group: outer
      - task_id: i
        group: outer.inner
      - task_id: load
    order_edges:
      - [outer.inner, outer.t]
      - [extract, outer]
      - [outer.spare, load]
