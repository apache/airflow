---
name: Publish Docs to S3
on:  # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      ref:
        description: "The branch or tag to checkout for the docs publishing"
        required: true
        type: string
      destination:
        description: "The destination location in S3"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - live
          - staging
      include-docs:
        description: "Space separated list of packages to build"
        required: true
        type: string
      exclude-docs:
        description: "Comma separated list of docs to exclude"
        required: false
        default: "no-docs-excluded"
        type: string
      skip-write-to-stable-folder:
        description: "Do not override stable version"
        required: false
        default: false
        type: boolean
      build-sboms:
        description: "Build SBOMs"
        required: false
        default: false
        type: boolean
      airflow-base-version:
        required: false
        description: "Override the Airflow Base Version to use for the docs build"
        type: string
      airflow-version:
        required: false
        description: "Override the Airflow Version to use for the docs build"
        type: string
      apply-commits:
        required: false
        description: "Optionally apply commit hashes before building - to patch the docs (coma separated)"
        type: string
      ignore-missing-inventories:
        required: false
        description: "Do not fail the build on missing third-party inventories"
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build-info:
    timeout-minutes: 10
    name: "Build Info"
    runs-on: ["ubuntu-24.04"]
    env:
      VERBOSE: true
      REF: ${{ inputs.ref }}
      INCLUDE_DOCS: ${{ inputs.include-docs }}
      EXCLUDE_DOCS: ${{ inputs.exclude-docs }}
      DESTINATION: ${{ inputs.destination }}
      SKIP_WRITE_TO_STABLE_FOLDER: ${{ inputs.skip-write-to-stable-folder }}
      BUILD_SBOMS: ${{ inputs.build-sboms }}
      AIRFLOW_BASE_VERSION: ${{ inputs.airflow-base-version || '' }}
      AIRFLOW_VERSION: ${{ inputs.airflow-version || '' }}
      APPLY_COMMITS: ${{ inputs.apply-commits || '' }}
    outputs:
      include-docs: ${{ case(inputs.include-docs == 'all', '', inputs.include-docs) }}
      destination-location: ${{ steps.parameters.outputs.destination-location }}
      destination: ${{ steps.parameters.outputs.destination }}
      extra-build-options: ${{ steps.parameters.outputs.extra-build-options }}
      airflow-base-version: ${{ steps.parameters.outputs.airflow-base-version }}
      airflow-version: ${{ steps.parameters.outputs.airflow-version }}
      publish-execution-api-schema: ${{ steps.parameters.outputs.publish-execution-api-schema }}
      publish-supervisor-schema: ${{ steps.parameters.outputs.publish-supervisor-schema }}
      # yamllint disable rule:line-length
      skip-write-to-stable-folder: ${{ inputs.skip-write-to-stable-folder && '--skip-write-to-stable-folder' || '' }}
      # Docs and the registry each build the image they need rather than sharing one. Sharing
      # meant sharing the Python too, which put the docs on 3.12 and broke publishing: Sphinx
      # mocks third-party modules, and from 3.12 functools copies __type_params__, so a mocked
      # decorator raises TypeError and providers fail to import. `breeze build-docs` pins itself
      # to the default Python, so this follows the same constant rather than restating a version.
      docs-python-version: ${{ steps.default_python.outputs.default-python-version }}
      registry-python-version: "3.12"
      # Discriminator for every stash this workflow writes. A bare ref would collide with any
      # other workflow stashing an image for the same ref, and the images here are special: built
      # from a release tag rather than a branch tip, and kept for days so the next publish of that
      # tag reuses them. Naming them after this workflow keeps them recognisably ours.
      image-stash-ref: "publish-docs-${{ inputs.ref }}"
      registry-providers: ${{ steps.derive_registry_inputs.outputs.registry-providers }}
      registry-full-build: ${{ steps.derive_registry_inputs.outputs.registry-full-build }}
    if: contains(fromJSON('[
      "ashb",
      "bugraoz93",
      "eladkal",
      "ephraimbuddy",
      "hussein-awala",
      "jedcunningham",
      "jscheffl",
      "kaxil",
      "o-nikolas",
      "pierrejeambrun",
      "shahar1",
      "potiuk",
      "uranusjr",
      "vincbeck",
      "vatsrahul1001",
      ]'), github.event.sender.login)
    steps:
      - name: "Checkout for wave provider derivation"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-tags: true
          fetch-depth: 0
      - name: "Derive registry trigger inputs"
        id: derive_registry_inputs
        env:
          INCLUDE_DOCS: ${{ inputs.include-docs }}
          REF: ${{ inputs.ref }}
        shell: bash
        # The registry rebuild is provider-targeted. For non-provider
        # distributions (apache-airflow, airflow-ctl, helm-chart, etc.) the
        # update-registry job below is a no-op anyway, so skip the derive
        # step — that lets release tags cut before
        # `dev/registry/derive_wave_providers.py` was added (#66100) still
        # publish docs without the workflow tripping on the missing file.
        # Tracked at #66436.
        run: |
          # Keep the non-provider list in sync with NON_PROVIDER_TOKENS in
          # dev/registry/derive_wave_providers.py, which documents why.
          # dev/registry/tests/test_derive_wave_providers.py pins the two together.
          NON_PROVIDER_TOKENS=("apache-airflow" "apache-airflow-ctl" "apache-airflow-mypy" "task-sdk" "java-sdk" "ts-sdk" "helm-chart" "docker-stack")
          has_provider=false
          for token in $INCLUDE_DOCS; do
            is_non_provider=false
            for np in "${NON_PROVIDER_TOKENS[@]}"; do
              if [[ "$token" == "$np" ]]; then
                is_non_provider=true
                break
              fi
            done
            if ! $is_non_provider; then
              has_provider=true
              break
            fi
          done
          if ! $has_provider; then
            echo "Non-provider distribution(s) only ('${INCLUDE_DOCS}') — skipping registry-derive."
            echo "registry-providers=" >> "${GITHUB_OUTPUT}"
            echo "registry-full-build=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 dev/registry/derive_wave_providers.py
      - name: "Derive the default Python version"
        id: default_python
        shell: bash
        # `breeze build-docs` always documents on breeze's default Python, so the image this
        # workflow builds for it has to be that same one. Reading the constant keeps the two from
        # drifting apart and silently making the docs job build an image nothing then uses.
        run: |
          DEFAULT_PYTHON=$(python3 -c "
          import re, pathlib
          text = pathlib.Path('dev/breeze/src/airflow_breeze/global_constants.py').read_text()
          versions = re.search(r'^ALL_PYTHON_MAJOR_MINOR_VERSIONS\s*=\s*\[(.*?)\]', text, re.M | re.S)
          print(re.findall(r'\"([0-9]+\.[0-9]+)\"', versions.group(1))[0])
          ")
          echo "Default Python version: '${DEFAULT_PYTHON}'"
          echo "default-python-version=${DEFAULT_PYTHON}" >> "${GITHUB_OUTPUT}"
      - name: "Input parameters summary"
        shell: bash
        id: parameters
        run: |
          echo "Input parameters summary"
          echo "========================="
          echo "Ref: '${REF}'"
          echo "Included docs : '${INCLUDE_DOCS}'"
          echo "Exclude docs: '${EXCLUDE_DOCS}'"
          echo "Destination: '${DESTINATION}'"
          echo "Skip write to stable folder: '${SKIP_WRITE_TO_STABLE_FOLDER}'"
          echo "Build SBOMs: '${BUILD_SBOMS}'"
          echo "Airflow Base Version: '${AIRFLOW_BASE_VERSION}'"
          echo "Airflow Version: '${AIRFLOW_VERSION}'"
          echo "Apply commits: '${APPLY_COMMITS}'"
          if [[ "${DESTINATION}" == "auto" ]]; then
             if [[ "${REF}" =~ ^.*[0-9]*\.[0-9]*\.[0-9]*$ ]]; then
                echo "${REF} looks like final release, using live destination"
                DESTINATION="live"
             else
                echo "${REF} does not looks like final release, using staging destination"
                DESTINATION="staging"
             fi
          fi
          echo "destination=${DESTINATION}" >> ${GITHUB_OUTPUT}
          if [[ "${DESTINATION}"  == "live" ]]; then
             echo "destination-location=s3://live-docs-airflow-apache-org/docs/" >> ${GITHUB_OUTPUT}
          else
             echo "destination-location=s3://staging-docs-airflow-apache-org/docs/" >> ${GITHUB_OUTPUT}
          fi
          if [[ " ${INCLUDE_DOCS} " =~ " apache-airflow " ]]; then
             if [[ ${AIRFLOW_BASE_VERSION=} == "" && ${AIRFLOW_VERSION=} == "" ]]; then
                echo "No Airflow Versions provided, using ${REF} to determine it."
                AIRFLOW_VERSION="${REF}"
                set +e
                AIRFLOW_BASE_VERSION=$(echo "${REF}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
                set -e
                if [[ ${AIRFLOW_BASE_VERSION=} == "" ]]; then
                   echo
                   echo "No Airflow Base Version found in ${REF}"
                   echo "You need to force airflow version and airflow base version in the workflow."
                   echo
                   exit 1
                fi
             fi
             echo "airflow-base-version=${AIRFLOW_BASE_VERSION}" >> ${GITHUB_OUTPUT}
             echo "airflow-version=${AIRFLOW_VERSION}" >> ${GITHUB_OUTPUT}
          else
             echo "airflow-version=no-airflow" >> ${GITHUB_OUTPUT}
             echo "airflow-base-version=no-airflow" >> ${GITHUB_OUTPUT}
          fi
          PUBLISH_EXEC="false"
          PUBLISH_SUP="false"
          if [[ "${INCLUDE_DOCS}" == "all" || "${INCLUDE_DOCS}" == "" ]]; then
             PUBLISH_EXEC="true"
             PUBLISH_SUP="true"
          else
             [[ " ${INCLUDE_DOCS} " == *" apache-airflow "* ]] && PUBLISH_EXEC="true"
             [[ " ${INCLUDE_DOCS} " == *" task-sdk "* ]] && PUBLISH_SUP="true"
          fi
          echo "publish-execution-api-schema=${PUBLISH_EXEC}" >> ${GITHUB_OUTPUT}
          echo "publish-supervisor-schema=${PUBLISH_SUP}" >> ${GITHUB_OUTPUT}

  build-docs:
    needs: [build-info]
    timeout-minutes: 150
    name: "Build documentation"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      INCLUDE_SUCCESS_OUTPUTS: false
      VERBOSE: "true"
      EXTRA_BUILD_OPTIONS: ${{ needs.build-info.outputs.extra-build-options }}
      APPLY_COMMITS: ${{ inputs.apply-commits || '' }}
      PYTHON_MAJOR_MINOR_VERSION: "${{ needs.build-info.outputs.docs-python-version }}"
      DOCKER_CACHE: "registry"
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
      - name: "Checkout current version first to clean-up stuff"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: current-version
      - name: "Free up disk space"
        shell: bash
        run: ./current-version/scripts/tools/free_up_disk_space.sh
      - name: "Make /mnt writeable"
        run: ./current-version/scripts/ci/make_mnt_writeable.sh
      - name: "Move docker to /mnt"
        run: ./current-version/scripts/ci/move_docker_to_mnt.sh
      - name: "Copy the version retrieval script"
        run: cp ./current-version/scripts/ci/docs/store_stable_versions.py /tmp/store_stable_versions.py
      # We check out repo for both - breeze and docs from the ref provided as input, so the CI
      # image is built from the version of Airflow matching the docs. The build uses the
      # registry buildx cache pushed by the last "main" Test workflow so that layer rebuilds
      # are avoided whenever the ref is close enough to main for the cache to apply.
      - name: "Checkout ${{ inputs.ref }} "
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
          fetch-tags: true
          fetch-depth: 0
      # A local action is read from the workspace, not from the ref the workflow itself runs from,
      # so an action added after this tag was cut is simply absent. Checking the workflow's own
      # version out alongside supplies the definition; the image is still built from the sources
      # above. It has to come after the checkout that populates the root, which cleans untracked
      # siblings away.
      - name: "Checkout the workflow version for its actions"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: workflow-version
      - name: "Apply patch commits if provided"
        run: |
          if [[ "${APPLY_COMMITS}" != "" ]]; then
            git config --global user.email "bot@airflow.apache.org"
            git config --global user.name "Your friendly bot"
            echo "Applying commits ${APPLY_COMMITS} to the docs"
            # Split APPLY_COMMITS by comma and apply each commit
            IFS=',' read -ra COMMIT_ARRAY <<< "${APPLY_COMMITS}"
            for APPLY_COMMIT in "${COMMIT_ARRAY[@]}"; do
              echo "Applying commit ${APPLY_COMMIT}"
              git fetch origin "${APPLY_COMMIT}"
              git cherry-pick "${APPLY_COMMIT}"
            done
          else
            echo "No commits provided to apply, skipping."
          fi
      - name: "Install Breeze from the ${{ inputs.ref }} reference"
        uses: ./.github/actions/breeze
        with:
          python-version: "${{ needs.build-info.outputs.docs-python-version }}"
      # Built here rather than in a job of its own: a separate job could only hand the image over
      # as a multi-gigabyte artifact, for a single consumer. The image, the commit it was built
      # from and the mount cache are still stashed under this ref, so the next publish of the same
      # ref seeds its build from them - or skips the build outright when the sources have not moved.
      - name: "Build CI image linux/amd64:${{ needs.build-info.outputs.docs-python-version }}"
        uses: ./workflow-version/.github/actions/build_ci_image_with_cache
        with:
          python: "${{ needs.build-info.outputs.docs-python-version }}"
          platform: "linux/amd64"
          image-stash-ref: "${{ needs.build-info.outputs.image-stash-ref }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          constraints-github-repository: >-
            ${{ secrets.CONSTRAINTS_GITHUB_REPOSITORY != '' &&
            secrets.CONSTRAINTS_GITHUB_REPOSITORY || 'apache/airflow' }}
      - name: "Restore docs inventory cache"
        # yamllint disable-line rule:line-length
        uses: apache/infrastructure-actions/stash/restore@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # restore/v1.0.0
        with:
          path: ./generated/_inventory_cache/
          key: cache-docs-inventory-v1
        id: restore-docs-inventory-cache
      - name: "Building docs with --docs-only flag using ${{ inputs.ref }} reference breeze"
        id: build-sphinx-docs
        env:
          INCLUDE_DOCS: ${{ needs.build-info.outputs.include-docs }}
          INCLUDE_COMMITS: ${{ startsWith(inputs.ref, 'providers') && 'true' || 'false' }}
          FAIL_ON_INVENTORIES: ${{ inputs.ignore-missing-inventories != true && '--fail-on-missing-third-party-inventories' || '' }}
        run: |
          # The language SDK docs are built by their own jobs with their native toolchains
          # (Dokka for java-sdk, TypeDoc for ts-sdk). Neither is a Sphinx package, so they
          # must not be passed to breeze build-docs.
          SPHINX_INCLUDE_DOCS=""
          for package in ${INCLUDE_DOCS}; do
            if [[ "${package}" != "java-sdk" && "${package}" != "ts-sdk" ]]; then
              SPHINX_INCLUDE_DOCS="${SPHINX_INCLUDE_DOCS} ${package}"
            fi
          done
          if [[ -n "${INCLUDE_DOCS}" && -z "${SPHINX_INCLUDE_DOCS// /}" ]]; then
            echo "Only language SDK docs were requested - skipping the Sphinx docs build."
            mkdir -p generated/_build/docs
            echo "The Sphinx docs build was skipped: only language SDK docs were requested." \
              > generated/_build/docs/sphinx-build-skipped.txt
            echo "sphinx-build-skipped=true" >> "${GITHUB_OUTPUT}"
          else
            breeze build-docs ${SPHINX_INCLUDE_DOCS} --docs-only ${FAIL_ON_INVENTORIES}
          fi
      - name: "Save docs inventory cache"
        uses: apache/infrastructure-actions/stash/save@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # save/v1.0.0
        if: >-
          steps.restore-docs-inventory-cache.outputs.stash-hit != 'true' &&
          steps.build-sphinx-docs.outputs.sphinx-build-skipped != 'true'
        with:
          path: ./generated/_inventory_cache/
          key: cache-docs-inventory-v1
          if-no-files-found: 'error'
          retention-days: '2'
      - name: "Generate Execution API schema artifact"
        if: needs.build-info.outputs.publish-execution-api-schema == 'true'
        # Building the in-process app runs its lifespan, which constructs the
        # JWT validator and requires a secret. The value is never used.
        run: |
          mkdir -p schemas
          breeze shell --quiet --backend=none \
            "AIRFLOW__API_AUTH__JWT_SECRET=schema-generation-not-a-real-secret \
             python scripts/ci/prek/generate_execution_api_schema.py > /files/execution-api.json"
          cp files/execution-api.json schemas/execution-api.json
      - name: "Generate Supervisor schema artifact"
        if: needs.build-info.outputs.publish-supervisor-schema == 'true'
        run: |
          mkdir -p schemas
          breeze shell --quiet --backend=none \
            "python scripts/ci/prek/dump_supervisor_schemas.py > /files/supervisor-schema.json"
          cp files/supervisor-schema.json schemas/supervisor-schema.json
      - name: "Upload schema artifacts"
        if: needs.build-info.outputs.publish-execution-api-schema == 'true' || needs.build-info.outputs.publish-supervisor-schema == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: airflow-schemas
          path: schemas/
          retention-days: '7'
          if-no-files-found: 'error'
          overwrite: 'true'
      - name: "Store stable versions"
        run: uv run /tmp/store_stable_versions.py
      - name: "Saving build docs folder"
        run: |
          if [ -d "generated/_build/" ]; then
            mv "generated/_build/" "/mnt/_build"
          elif [ -d "docs/_build/" ]; then
            # handle Airflow 2 case
            mv "docs/_build/" "/mnt/_build"
          else
            echo "No build docs found to save"
            exit 1
          fi
      - name: "Upload build docs"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: airflow-docs
          path: /mnt/_build
          retention-days: '7'
          if-no-files-found: 'error'
          overwrite: 'true'

  build-java-sdk-docs:
    needs: [build-info]
    timeout-minutes: 30
    name: "Build Java SDK Javadoc"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "true"
    outputs:
      built: ${{ steps.sdk-present.outputs.exists }}
    steps:
      - name: "Checkout ${{ inputs.ref }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: "Decide whether to build the Java SDK Javadoc"
        id: sdk-present
        env:
          REF: ${{ inputs.ref }}
          INCLUDE_DOCS: ${{ inputs.include-docs }}
        run: |
          # The Java SDK Javadoc is only built (and later published) for full doc
          # builds (include-docs == 'all') or when 'java-sdk' is explicitly listed.
          # When a specific list of packages is passed (e.g. a provider release
          # wave like "amazon cncf.kubernetes ..."), the Java SDK must NOT be added
          # automatically — a providers-only publish should not suddenly refresh the
          # java-sdk docs as a side effect.
          if [[ "${INCLUDE_DOCS}" != "all" && " ${INCLUDE_DOCS} " != *" java-sdk "* ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "include-docs='${INCLUDE_DOCS}' is a specific package list without 'java-sdk' — skipping Javadoc build."
          elif [[ -f "java-sdk/gradlew" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "java-sdk/ not found at ref ${REF} — skipping Javadoc build."
          fi
      - name: "Install Breeze"
        if: steps.sdk-present.outputs.exists == 'true'
        uses: ./.github/actions/breeze
      - name: "Build Java SDK Javadoc"
        if: steps.sdk-present.outputs.exists == 'true'
        run: breeze build-docs --sdk-docs-only --sdk=java
      - name: "Upload Java SDK docs"
        if: steps.sdk-present.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: java-sdk-docs
          path: generated/_build/docs/java-sdk/
          retention-days: '7'
          if-no-files-found: 'error'
          overwrite: 'true'

  build-ts-sdk-docs:
    needs: [build-info]
    timeout-minutes: 30
    name: "Build TypeScript SDK API reference"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "true"
    outputs:
      built: ${{ steps.sdk-present.outputs.exists }}
    steps:
      - name: "Checkout ${{ inputs.ref }}"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: "Decide whether to build the TypeScript SDK API reference"
        id: sdk-present
        env:
          REF: ${{ inputs.ref }}
          INCLUDE_DOCS: ${{ inputs.include-docs }}
        run: |
          # Mirrors the java-sdk rule: only build for full doc builds (include-docs == 'all')
          # or when 'ts-sdk' is explicitly listed. A providers-only publish wave must not
          # refresh the ts-sdk docs as a side effect.
          if [[ "${INCLUDE_DOCS}" != "all" && " ${INCLUDE_DOCS} " != *" ts-sdk "* ]]; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "include-docs='${INCLUDE_DOCS}' is a specific package list without 'ts-sdk' — skipping TypeDoc build."
          elif [[ -f "ts-sdk/docs/typedoc.config.mjs" ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "ts-sdk/docs/ not found at ref ${REF} — skipping TypeDoc build."
          fi
      - name: "Install Breeze"
        if: steps.sdk-present.outputs.exists == 'true'
        uses: ./.github/actions/breeze
      # The TypeDoc toolchain is installed with `npm ci` inside the build container, which
      # reads its download cache from HOME. Without this the ~250 pinned packages are
      # fetched from the registry on every run.
      - name: "Cache TypeDoc toolchain downloads"
        if: steps.sdk-present.outputs.exists == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ts-sdk/docs/.npm-home/.npm
          key: ts-sdk-docs-npm-${{ hashFiles('ts-sdk/docs/package-lock.json') }}
          restore-keys: ts-sdk-docs-npm-
      - name: "Build TypeScript SDK API reference"
        if: steps.sdk-present.outputs.exists == 'true'
        run: breeze build-docs --sdk-docs-only --sdk=typescript
      - name: "Upload TypeScript SDK docs"
        if: steps.sdk-present.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ts-sdk-docs
          path: generated/_build/docs/ts-sdk/
          retention-days: '7'
          if-no-files-found: 'error'
          overwrite: 'true'

  publish-docs-to-s3:
    needs: [build-docs, build-java-sdk-docs, build-ts-sdk-docs, build-info, update-registry]
    # `update-registry` is skipped for non-provider distributions, and a job whose dependency was
    # skipped is skipped in turn, so its result is checked rather than implied - which means the
    # two that are not conditional have to be asserted here as well.
    if: >
      !cancelled() && needs.build-docs.result == 'success' &&
      needs.build-java-sdk-docs.result == 'success' &&
      needs.build-ts-sdk-docs.result == 'success' &&
      needs.update-registry.result != 'failure'
    name: "Publish documentation to S3"
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      INCLUDE_SUCCESS_OUTPUTS: false
      PYTHON_MAJOR_MINOR_VERSION: "${{ needs.build-info.outputs.docs-python-version }}"
      VERBOSE: "true"
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
        # We are checking repo for both - breeze and docs from the "workflow' branch
        # This will take longer as we need to rebuild CI image and it will not use cache
        # but it will build the CI image from the version of Airflow that is used to check out things
        # We also fetch the whole history to be able to prepare SBOM files
      - name: "Checkout current version with all history for SBOM"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: "Make /mnt writeable and cleanup"
        shell: bash
        run: ./scripts/ci/make_mnt_writeable.sh
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
      - name: "Download docs prepared as artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: airflow-docs
          path: /mnt/_build
      - name: "Move docs to generated folder"
        run: mv /mnt/_build generated/_build
      - name: "Download Java SDK docs artifact"
        if: needs.build-java-sdk-docs.outputs.built == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: java-sdk-docs
          path: generated/_build/docs/java-sdk
      - name: "Download TypeScript SDK docs artifact"
        if: needs.build-ts-sdk-docs.outputs.built == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ts-sdk-docs
          path: generated/_build/docs/ts-sdk
      - name: "Make sure SBOM dir exists and has the right permissions"
        run: |
          sudo mkdir -vp ./files/sbom
          sudo chown -R "${USER}" .
        if: inputs.build-sboms
      - name: "Prepare SBOMs"
        env:
          AIRFLOW_VERSION: ${{ needs.build-info.outputs.airflow-version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_VERSION: "${{ needs.build-info.outputs.docs-python-version }}"
          FORCE: "true"
        run: >
          breeze sbom update-sbom-information
          --airflow-version ${AIRFLOW_VERSION} --remote-name origin --force
          --all-combinations --run-in-parallel --airflow-root-path "${GITHUB_WORKSPACE}"
        if: inputs.build-sboms
      - name: "Generated SBOM files"
        run: |
          echo "Generated SBOM files:"
          find ./generated/_build/docs/apache-airflow/stable/sbom/ -type f | sort
        if: inputs.build-sboms
      - name: Check disk space available
        run: df -H
      # Here we will create temp airflow-site dir to publish docs
      - name: Create /mnt/airflow-site directory
        run: |
          sudo mkdir -p /mnt/airflow-site && sudo chown -R "${USER}" /mnt/airflow-site
          echo "AIRFLOW_SITE_DIRECTORY=/mnt/airflow-site/" >> "$GITHUB_ENV"
      - name: "Publish docs to /mnt/airflow-site directory using ${{ inputs.ref }} reference breeze"
        env:
          INCLUDE_DOCS: ${{ needs.build-info.outputs.include-docs }}
        run: >
          breeze release-management publish-docs --override-versioned --run-in-parallel
          ${INCLUDE_DOCS}
      - name: Check disk space available
        run: df -H
      - name: "Update watermarks"
        env:
          SOURCE_DIR_PATH: "/mnt/airflow-site/docs-archive/"
        # yamllint disable rule:line-length
        run: |
          curl -sSf -o add_watermark.py https://raw.githubusercontent.com/apache/airflow-site/refs/heads/main/.github/scripts/add_watermark.py \
          --header "Authorization: Bearer ${{ github.token }} " --header "X-GitHub-Api-Version: 2022-11-28"
          chmod a+x add_watermark.py
          mkdir -p images
          curl -sSf -o images/staging.png https://raw.githubusercontent.com/apache/airflow-site/refs/heads/main/.github/scripts/images/staging.png
          uv run add_watermark.py --pattern 'main.min*css' --folder ${SOURCE_DIR_PATH} \
          --image-directory images --url-prefix /images
        if: needs.build-info.outputs.destination == 'staging'
      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          rm /tmp/awscliv2.zip
          sudo /tmp/aws/install --update
          rm -rf /tmp/aws/
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.DOCS_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2
      - name: "Syncing docs to S3"
        env:
          DESTINATION_LOCATION: "${{ needs.build-info.outputs.destination-location }}"
          SOURCE_DIR_PATH: "/mnt/airflow-site/docs-archive/"
          EXCLUDE_DOCS: "${{ inputs.exclude-docs }}"
          SKIP_WRITE_TO_STABLE_FOLDER: "${{ needs.build-info.outputs.skip-write-to-stable-folder }}"
        run: |
          breeze release-management publish-docs-to-s3 --source-dir-path ${SOURCE_DIR_PATH} \
          --destination-location ${DESTINATION_LOCATION} --stable-versions \
          --exclude-docs "${EXCLUDE_DOCS}" --overwrite ${SKIP_WRITE_TO_STABLE_FOLDER}
      - name: "Download schema artifacts"
        if: needs.build-info.outputs.publish-execution-api-schema == 'true' || needs.build-info.outputs.publish-supervisor-schema == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: airflow-schemas
          path: schemas
      - name: "Publish schemas to S3"
        if: needs.build-info.outputs.publish-execution-api-schema == 'true' || needs.build-info.outputs.publish-supervisor-schema == 'true'
        env:
          DESTINATION_LOCATION: "${{ needs.build-info.outputs.destination-location }}"
          PUBLISH_EXEC: "${{ needs.build-info.outputs.publish-execution-api-schema }}"
          PUBLISH_SUP: "${{ needs.build-info.outputs.publish-supervisor-schema }}"
        run: |
          # Reuse the docs bucket but publish under the schemas/ prefix.
          SCHEMAS_DESTINATION="${DESTINATION_LOCATION%docs/}schemas/"
          args=()
          if [[ "${PUBLISH_EXEC}" == "true" ]]; then
             args+=(--execution-api schemas/execution-api.json)
          fi
          if [[ "${PUBLISH_SUP}" == "true" ]]; then
             args+=(--supervisor schemas/supervisor-schema.json)
          fi
          breeze release-management publish-schemas-to-s3 \
            --destination-location "${SCHEMAS_DESTINATION}" "${args[@]}"

  update-registry:
    # Runs alongside the docs build rather than after it: the registry reads nothing the docs
    # build produces, so ordering the two only added its whole duration to the wait. The publish
    # does wait for it, so a run reports success once both halves are actually out.
    needs: [build-info]
    if: needs.build-info.outputs.registry-providers != '' || needs.build-info.outputs.registry-full-build == 'true'
    name: "Update Provider Registry"
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/registry-build.yml
    with:
      destination: ${{ needs.build-info.outputs.destination }}
      provider: ${{ needs.build-info.outputs.registry-providers }}
      # The registry extracts on 3.12 and the docs build on the default Python, so each builds the
      # image it needs in the job that uses it, keyed by this ref so consecutive publishes reuse it.
      python-version: ${{ needs.build-info.outputs.registry-python-version }}
      # Without this the registry would read main rather than the ref being published.
      checkout-ref: ${{ inputs.ref }}
      image-stash-ref: ${{ needs.build-info.outputs.image-stash-ref }}
    secrets:
      DOCS_AWS_ACCESS_KEY_ID: ${{ secrets.DOCS_AWS_ACCESS_KEY_ID }}
      DOCS_AWS_SECRET_ACCESS_KEY: ${{ secrets.DOCS_AWS_SECRET_ACCESS_KEY }}
