---
name: Clean up old image versions
# Deletes, a few hundred per run from one package in turn, the untagged CI and PROD image versions
# older than 30 days that no tag references. Small, spaced-out runs keep it far below the API rate
# limit of the workflow token. See scripts/ci/cleanup_old_image_versions.py.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only list what would be deleted"
        type: boolean
        default: true
      max-deletions:
        description: "Stop after this many deletions"
        type: string
        default: "300"
permissions:
  contents: read
concurrency:
  group: cleanup-old-image-versions
  cancel-in-progress: false
jobs:
  cleanup:
    name: "Clean up old image versions"
    runs-on: ["ubuntu-slim"]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    if: github.repository == 'apache/airflow'
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Delete old untagged image versions"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
          MAX_DELETIONS: ${{ inputs.max-deletions || '300' }}
        run: >
          python3 scripts/ci/cleanup_old_image_versions.py
          --days 30 --max-deletions "${MAX_DELETIONS}" --pause 1 ${DRY_RUN}
