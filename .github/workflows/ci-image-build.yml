---
name: Build CI images
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runners:
        description: "The array of labels (in json form) determining runners."
        required: true
        type: string
      target-commit-sha:
        description: "The commit SHA to checkout for the build"
        required: false
        default: ""
        type: string
      checkout-ref:
        description: "Commit-ish to checkout sources from (empty = workflow ref)."
        required: false
        default: ""
        type: string
      pull-request-target:
        description: "Whether we are running this from pull-request-target workflow (true/false)"
        required: false
        default: "false"
        type: string
      is-committer-build:
        description: "Whether the build is executed by committer (true/false)"
        required: false
        default: "false"
        type: string
      platform:
        description: "Platform for the build - 'linux/amd64' or 'linux/arm64'"
        required: true
        type: string
      push-image:
        description: "Whether to push image to the registry (true/false)"
        required: false
        default: "true"
        type: string
      upload-image-artifact:
        description: "Whether to upload docker image artifact"
        required: true
        type: string
      upload-mount-cache-artifact:
        description: "Whether to upload mount-cache artifact"
        required: true
        type: string
      debian-version:
        description: "Base Debian distribution to use for the build (trixie)"
        type: string
        default: "trixie"
      install-mysql-client-type:
        description: "MySQL client type to use during build (mariadb/mysql)"
        type: string
        default: "mariadb"
      use-uv:
        description: "Whether to use uv to build the image (true/false)"
        required: true
        type: string
      python-versions:
        description: "JSON-formatted array of Python versions to build images from"
        required: true
        type: string
        default: '[""]'
      branch:
        description: "Branch used to run the CI jobs in (main/v*_*_test)."
        required: true
        type: string
      constraints-branch:
        description: "Branch used to construct constraints URL from."
        required: true
        type: string
      upgrade-to-newer-dependencies:
        description: "Whether to attempt to upgrade image to newer dependencies (false/RANDOM_VALUE)"
        required: true
        type: string
      docker-cache:
        description: "Docker cache specification to build the image (registry, local, disabled)."
        required: true
        type: string
      retry-without-cache:
        description: "Retry the build once with the cache disabled if the cached build fails (true/false)"
        required: false
        default: "false"
        type: string
      disable-airflow-repo-cache:
        description: "Disable airflow repo cache read from main."
        required: true
        type: string
      seed-cache-from-stashed-image:
        description: >
          Seed the build cache from the CI image an earlier run stashed (true/false). Worth it
          where the registry cache is built for a different branch than the sources - the
          previous image matches them layer for layer, the registry cache of another branch may
          match nothing.
        required: false
        default: "false"
        type: string
      image-stash-ref:
        description: >
          Stash the image under a key of its own for this ref instead of the per-branch one.
          Callers that build many different refs from one branch pass the ref here: sharing the
          per-branch stash would make them seed each other's builds, and refs far enough apart
          make poor caches for one another. Seeding prefers this stash and falls back to the
          per-branch one; whoever consumes the image afterwards must restore the same key.
        required: false
        default: ""
        type: string
permissions:
  contents: read
jobs:
  build-ci-images:
    strategy:
      fail-fast: true
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    timeout-minutes: 110
    name: "Build CI ${{ inputs.platform }} image ${{ matrix.python-version }}"
    runs-on: ${{ fromJSON(inputs.runners) }}
    env:
      BACKEND: sqlite
      PYTHON_MAJOR_MINOR_VERSION: ${{ matrix.python-version }}
      DEFAULT_BRANCH: ${{ inputs.branch }}
      DEFAULT_CONSTRAINTS_BRANCH: ${{ inputs.constraints-branch }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "true"
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
      - name: "Checkout target branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - name: "Free up disk space"
        shell: bash
        run: ./scripts/tools/free_up_disk_space.sh
      - name: "Make /mnt writeable"
        run: ./scripts/ci/make_mnt_writeable.sh
      - name: "Move docker to /mnt"
        run: ./scripts/ci/move_docker_to_mnt.sh
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
      # A ref is not a commit: a branch documented twice moves between the two publishes, and
      # an image built before it moved is a cache, not an answer. The commit each stashed image
      # is saved with tells the two apart, and it is stashed separately so that deciding costs
      # a few bytes rather than the multi-gigabyte image the decision may make unnecessary.
      - name: >
          Restore the commit the CI image stashed for ref ${{ inputs.image-stash-ref }}
          was built from
        # yamllint disable-line rule:line-length
        uses: apache/infrastructure-actions/stash/restore@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # restore/v1.0.0
        with:
          key: "ci-image-commit-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}\
            -${{ inputs.image-stash-ref }}"
          path: "/mnt/"
          only-current-branch: 'true'
        id: restore-image-commit
        if: >
          inputs.seed-cache-from-stashed-image == 'true' && inputs.image-stash-ref != '' &&
          inputs.push-image != 'true'
      - name: >
          Check whether the CI image stashed for ref ${{ inputs.image-stash-ref }} was built
          from this commit
        id: stashed-image
        env:
          COMMIT_FILE: "/mnt/ci-image-commit-${{ env.PYTHON_MAJOR_MINOR_VERSION }}.txt"
        run: |
          head_sha="$(git rev-parse HEAD)"
          stashed_sha="$(cat "${COMMIT_FILE}" 2>/dev/null || true)"
          if [[ "${stashed_sha}" == "${head_sha}" ]]; then
            echo "The stashed image was built from ${head_sha} - reusing it, without a build."
            echo "reusable=true" >> "${GITHUB_OUTPUT}"
          else
            echo "The stashed image was built from '${stashed_sha:-unknown}', not ${head_sha}."
            echo "It can only seed the build cache."
          fi
        shell: bash
        if: steps.restore-image-commit.outputs.stash-hit == 'true'
      # Restored ahead of the caches that feed the build, so that a build made unnecessary
      # above skips them too.
      - name: >
          Restore CI docker image built for ref ${{ inputs.image-stash-ref }}
          ${{ inputs.platform }}:${{ env.PYTHON_MAJOR_MINOR_VERSION }}
        # yamllint disable-line rule:line-length
        uses: apache/infrastructure-actions/stash/restore@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # restore/v1.0.0
        with:
          key: "ci-image-save-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}\
            -${{ inputs.image-stash-ref }}"
          path: "/mnt/"
          only-current-branch: 'true'
        id: restore-cache-image-for-ref
        if: >
          inputs.seed-cache-from-stashed-image == 'true' && inputs.image-stash-ref != '' &&
          steps.stashed-image.outputs.reusable != 'true'
      # Scoped to the ref for the same reason the image is: the mount cache holds the dependency
      # set the sources resolve to, and a ref's and the branch tip's are exactly what differ.
      - name: >
          Restore ci-cache mount image ${{ inputs.platform }}:${{ env.PYTHON_MAJOR_MINOR_VERSION }}
          ${{ inputs.image-stash-ref != '' && format('for ref {0}', inputs.image-stash-ref) || '' }}
        # yamllint disable-line rule:line-length
        uses: apache/infrastructure-actions/stash/restore@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # restore/v1.0.0
        with:
          key: "ci-cache-mount-save-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}\
            ${{ inputs.image-stash-ref != '' && format('-{0}', inputs.image-stash-ref) || '' }}"
          path: "/tmp/"
        id: restore-cache-mount
        if: steps.stashed-image.outputs.reusable != 'true'
      - name: "Verify ci-cache file exists"
        if: steps.restore-cache-mount.outputs.stash-hit == 'true'
        env:
          CACHE_FILE: "/tmp/ci-cache-mount-save-v3-${{ env.PYTHON_MAJOR_MINOR_VERSION }}.tar.gz"
        run: |
          if [ ! -f "$CACHE_FILE" ]; then
            echo "Cache file not found: $CACHE_FILE"
            echo "Stash restore may have timed out. Check the 'Restore ci-cache mount' step"
            echo "for download errors. Re-run the job to retry."
            exit 1
          fi
        shell: bash
      - name: "Import mount-cache ${{ inputs.platform }}:${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        env:
          PYTHON_MAJOR_MINOR_VERSION: ${{ env.PYTHON_MAJOR_MINOR_VERSION }}
        run: >
          breeze ci-image import-mount-cache
          --cache-file /tmp/ci-cache-mount-save-v3-${PYTHON_MAJOR_MINOR_VERSION}.tar.gz
        if: steps.restore-cache-mount.outputs.stash-hit == 'true'
      - name: "Restore CI docker image ${{ inputs.platform }}:${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        # yamllint disable-line rule:line-length
        uses: apache/infrastructure-actions/stash/restore@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # restore/v1.0.0
        with:
          key: "ci-image-save-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
          path: "/mnt/"
          only-current-branch: 'true'
        id: restore-cache-image
        if: >
          inputs.seed-cache-from-stashed-image == 'true' &&
          steps.stashed-image.outputs.reusable != 'true' &&
          steps.restore-cache-image-for-ref.outputs.stash-hit != 'true'
      # BuildKit reads an image's recorded layer cache only when it can pull that image's layers
      # from a registry - one merely loaded into the docker engine contributes nothing. So the
      # image an earlier run stashed is served back to the build from a registry on localhost.
      - name: "Serve stashed image as cache ${{ inputs.platform }}:${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        env:
          PLATFORM: ${{ inputs.platform }}
          CACHE_IMAGE: "localhost:5000/ci-image-cache:${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        run: |
          docker run -d --name cache-registry -p 5000:5000 registry:2
          breeze ci-image load --platform "${PLATFORM}" --python "${PYTHON_MAJOR_MINOR_VERSION}" \
            --image-file-dir "/mnt" --tag-as "${CACHE_IMAGE}"
          docker push "${CACHE_IMAGE}"
          echo "CACHE_FROM_IMAGE=${CACHE_IMAGE}" >> "${GITHUB_ENV}"
        shell: bash
        if: >
          steps.stashed-image.outputs.reusable != 'true' && (
          steps.restore-cache-image-for-ref.outputs.stash-hit == 'true' ||
          steps.restore-cache-image.outputs.stash-hit == 'true')
      - name: "Login to ghcr.io"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${ACTOR} --password-stdin
        if: steps.stashed-image.outputs.reusable != 'true'
      - name: >
          Build ${{ inputs.push-image == 'true' && ' & push ' || '' }}
          ${{ inputs.platform }}:${{ env.PYTHON_MAJOR_MINOR_VERSION }} image
        run: |
          if breeze ci-image build --platform "${PLATFORM}"; then
            exit 0
          fi
          if [[ "${RETRY_WITHOUT_CACHE}" != "true" ]]; then
            exit 1
          fi
          # Reached when the ref's pyproject.toml has drifted far enough from the branch the
          # cache was built for that the cached layers cannot satisfy it. Slow, but correct.
          echo "Build with ${DOCKER_CACHE} cache failed - retrying with the cache disabled."
          DOCKER_CACHE="disabled" breeze ci-image build --platform "${PLATFORM}"
        env:
          RETRY_WITHOUT_CACHE: ${{ inputs.retry-without-cache }}
          DOCKER_CACHE: ${{ inputs.docker-cache }}
          DISABLE_AIRFLOW_REPO_CACHE: ${{ inputs.disable-airflow-repo-cache }}
          INSTALL_MYSQL_CLIENT_TYPE: ${{ inputs.install-mysql-client-type }}
          UPGRADE_TO_NEWER_DEPENDENCIES: ${{ inputs.upgrade-to-newer-dependencies }}
          # You can override CONSTRAINTS_GITHUB_REPOSITORY by setting secret in your repo but by default the
          # Airflow one is going to be used
          CONSTRAINTS_GITHUB_REPOSITORY: >-
            ${{ secrets.CONSTRAINTS_GITHUB_REPOSITORY != '' &&
            secrets.CONSTRAINTS_GITHUB_REPOSITORY || 'apache/airflow' }}
          # In builds from forks, this token is read-only. For scheduled/direct push it is WRITE one
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.actor }}
          PUSH: ${{ inputs.push-image }}
          VERBOSE: "true"
          PLATFORM: ${{ inputs.platform }}
        if: steps.stashed-image.outputs.reusable != 'true'
      - name: "Stop serving the cache image"
        # The registry holds a second copy of a multi-gigabyte image and the export below needs
        # the room.
        run: |
          docker rm -f cache-registry
          docker rmi "${CACHE_FROM_IMAGE}"
        shell: bash
        if: always() && env.CACHE_FROM_IMAGE != ''
      - name: "Export CI docker image ${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        env:
          PLATFORM: ${{ inputs.platform }}
          COMMIT_FILE: "/mnt/ci-image-commit-${{ env.PYTHON_MAJOR_MINOR_VERSION }}.txt"
        run: |
          breeze ci-image save --platform "${PLATFORM}" --image-file-dir "/mnt"
          git rev-parse HEAD > "${COMMIT_FILE}"
        shell: bash
        if: inputs.upload-image-artifact == 'true' && steps.stashed-image.outputs.reusable != 'true'
      - name: "Stash CI docker image ${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        uses: apache/infrastructure-actions/stash/save@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # save/v1.0.0
        with:
          key: ci-image-save-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}
          path: "/mnt/ci-image-save-*-${{ env.PYTHON_MAJOR_MINOR_VERSION }}.tar"
          if-no-files-found: 'error'
          retention-days: '2'
        if: inputs.upload-image-artifact == 'true' && inputs.image-stash-ref == ''
      # The per-branch stash above is written by every build on this branch, so an image built
      # from a ref other than the branch tip cannot live there: whoever restores it next would
      # get sources they never asked for. The ref keeps its own stash instead, which is also
      # what a later publish of that same ref reads - hence a retention that outlives the shared
      # one, the same ref being rebuilt three days apart at the very least.
      - name: "Stash CI docker image built for ref ${{ inputs.image-stash-ref }}"
        uses: apache/infrastructure-actions/stash/save@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # save/v1.0.0
        with:
          key: "ci-image-save-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}\
            -${{ inputs.image-stash-ref }}"
          path: "/mnt/ci-image-save-*-${{ env.PYTHON_MAJOR_MINOR_VERSION }}.tar"
          if-no-files-found: 'error'
          retention-days: '6'
        if: >
          inputs.upload-image-artifact == 'true' && inputs.image-stash-ref != '' &&
          steps.stashed-image.outputs.reusable != 'true'
      # Saved last and with the image's retention, so that finding this commit is enough to
      # know the image it describes is there to be restored.
      - name: "Stash the commit the CI image for ref ${{ inputs.image-stash-ref }} was built from"
        uses: apache/infrastructure-actions/stash/save@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # save/v1.0.0
        with:
          key: "ci-image-commit-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}\
            -${{ inputs.image-stash-ref }}"
          path: "/mnt/ci-image-commit-${{ env.PYTHON_MAJOR_MINOR_VERSION }}.txt"
          if-no-files-found: 'error'
          retention-days: '6'
        if: >
          inputs.upload-image-artifact == 'true' && inputs.image-stash-ref != '' &&
          steps.stashed-image.outputs.reusable != 'true'
      - name: "Export mount cache ${{ inputs.platform }}:${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        env:
          PYTHON_MAJOR_MINOR_VERSION: ${{ env.PYTHON_MAJOR_MINOR_VERSION }}
        run: >
          breeze ci-image export-mount-cache
          --cache-file /tmp/ci-cache-mount-save-v3-${PYTHON_MAJOR_MINOR_VERSION}.tar.gz
        if: >
          inputs.upload-mount-cache-artifact == 'true' &&
          steps.stashed-image.outputs.reusable != 'true'
      - name: >
          Stash cache mount ${{ inputs.platform }}:${{ env.PYTHON_MAJOR_MINOR_VERSION }}
          ${{ inputs.image-stash-ref != '' && format('for ref {0}', inputs.image-stash-ref) || '' }}
        uses: apache/infrastructure-actions/stash/save@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # save/v1.0.0
        with:
          key: "ci-cache-mount-save-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}\
            ${{ inputs.image-stash-ref != '' && format('-{0}', inputs.image-stash-ref) || '' }}"
          path: "/tmp/ci-cache-mount-save-v3-${{ env.PYTHON_MAJOR_MINOR_VERSION }}.tar.gz"
          if-no-files-found: 'error'
          # A ref's cache is read by the next publish of that same ref, days rather than hours
          # later, so it gets the retention the ref's image gets rather than the branch's.
          retention-days: ${{ inputs.image-stash-ref != '' && '6' || '2' }}
        if: >
          inputs.upload-mount-cache-artifact == 'true' &&
          steps.stashed-image.outputs.reusable != 'true'
      - name: "Check disk space after build"
        run: df -H
