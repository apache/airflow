---
name: Dependency upgrade report
# Both the job gate and the API validation reject PRs and foreign repositories. Only
# completed main schedule/dispatch runs are executed, with a read-only token and no secrets.
"on":  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: ["Tests (AMD)"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
# Every canary attempt fires this workflow and gets its own report of the inputs it saved.
concurrency:
  group: dependency-report-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: >-
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-reports: ${{ steps.plan.outputs.has-reports }}
      source-sha: ${{ steps.plan.outputs.source-sha }}
      source-run-id: ${{ steps.plan.outputs.source-run-id }}
    steps:
      - name: "Select inputs from the original canary run"
        id: plan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        with:
          script: |
            const rawId = process.env.SOURCE_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(rawId)) throw new Error('Invalid source run ID');
            const run_id = Number(rawId);
            if (!Number.isSafeInteger(run_id)) throw new Error('Invalid source run ID');
            const rawAttempt = process.env.SOURCE_RUN_ATTEMPT;
            if (!/^[1-9][0-9]{0,3}$/.test(rawAttempt)) throw new Error('Invalid source run attempt');
            const attempt_number = Number(rawAttempt);
            const repo = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRunAttempt(
              { ...repo, run_id, attempt_number });
            if (run.head_repository.full_name !== `${repo.owner}/${repo.repo}` ||
                run.head_branch !== 'main' || run.path !== '.github/workflows/ci-amd.yml' ||
                !['schedule', 'workflow_dispatch'].includes(run.event) || run.status !== 'completed') {
              throw new Error('Only completed main AMD canary runs are supported');
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              { ...repo, run_id, per_page: 100 });
            const include = [];
            const skipped = [];
            const explained = [];
            const inputName = new RegExp('^dependency-report-inputs-(3\\.[0-9]+)-' +
              '(constraints(?:-source-providers|-no-providers)?)-(true|false)-([1-9][0-9]*)$');
            const saved = artifacts.map(a => [a, inputName.exec(a.name)]).filter(([, match]) => match);
            // Only RunsOn runners can read RunsOn's S3 cache, where a canary on RunsOn keeps its CI image.
            const runsOnRunner = `runs-on=${process.env.GITHUB_RUN_ID}/family=m7a+m7i+m6a+m6i` +
              '/image=ubuntu22-full-x64/volume=150gb/cpu=8/ram=32';
            for (const [input, [, python, mode, useUv, attempt]] of saved) {
              if (attempt !== rawAttempt) continue;
              const entry = `${python}:${mode}`;
              // A re-run canary saves its inputs again; they are explained only for the first attempt.
              if (saved.some(([, m]) => m[1] === python && m[2] === mode && m[3] === useUv &&
                  Number(m[4]) < attempt_number)) {
                explained.push(entry);
                continue;
              }
              // The stash action names the artifact after the stash key, with '/' as '_', and the branch.
              // On RunsOn runners the image itself goes to RunsOn's S3 cache and the artifact is only
              // its digest, stashed under the key plus '-s3' (see .github/actions/stash-save).
              const imageName = `ci-image-save-v3-linux_amd64-${python}-main`;
              const image = artifacts.find(a => a.name === imageName) ||
                artifacts.find(a => a.name === `ci-image-save-v3-linux_amd64-${python}-s3-main`);
              const missing = input.expired ? 'inputs expired' :
                !image ? 'CI image missing' : image.expired ? 'CI image expired' : '';
              if (missing) {
                core.warning(`Skipping ${entry}: original inputs or CI image unavailable (${missing})`);
                skipped.push(`${entry} (${missing})`);
                continue;
              }
              const fromS3 = image.name !== imageName;
              include.push({ python, mode, 'use-uv': useUv, 'inputs-id': input.id, 'image-id': image.id,
                'image-source': fromS3 ? 's3' : 'artifact', runner: fromS3 ? runsOnRunner : 'ubuntu-22.04' });
            }
            core.setOutput('matrix', JSON.stringify({ include }));
            core.setOutput('has-reports', include.length > 0 ? 'true' : 'false');
            core.setOutput('source-sha', run.head_sha);
            core.setOutput('source-run-id', rawId);
            if (!include.length && skipped.length && Number(process.env.GITHUB_RUN_ATTEMPT) > 1) {
              throw new Error('Saved report inputs are missing or expired');
            }
            if (!include.length && !skipped.length) {
              core.notice(explained.length ?
                'The saved report inputs were already explained for an earlier canary attempt' :
                'No saved report inputs: this run did not request independent diagnostics');
            }
            await core.summary.addHeading('Dependency upgrade diagnostics')
              .addLink(`Source canary run (attempt ${rawAttempt})`, run.html_url)
              .addRaw(`\n\nSource revision: ${run.head_sha}\n\nReports: ${include.length}\n`)
              .addRaw(skipped.length ? `\nSkipped: ${skipped.join(', ')}\n` : '')
              .addRaw(explained.length ? `\nExplained for an earlier attempt: ${explained.join(', ')}\n` : '')
              .write();

  explain:
    needs: plan
    if: needs.plan.outputs.has-reports == 'true'
    name: "Explain ${{ matrix.python }}:${{ matrix.mode }}"
    runs-on: ${{ matrix.runner }}
    # Explaining constraints-source-providers took up to 115 minutes in the canary (Oct 2026).
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      VERBOSE: "false"
      USE_UV: ${{ matrix.use-uv }}
    steps:
      - name: "Checkout the tested revision"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source-sha }}
          persist-credentials: false
      # The disk is prepared as in the image build jobs: the loaded image and uv resolutions outgrow /,
      # and the runner scripts come from the workflow's own version, which knows RunsOn's disks.
      - name: "Checkout the workflow version for its actions and runner scripts"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: workflow-version
          sparse-checkout: |
            .github/actions
            scripts/ci
      - name: "Free up disk space"
        shell: bash
        run: ./scripts/tools/free_up_disk_space.sh
      - name: "Make /mnt writeable"
        run: ./workflow-version/scripts/ci/make_mnt_writeable.sh
      - name: "Move docker to /mnt"
        run: ./workflow-version/scripts/ci/move_docker_to_mnt.sh
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
      - name: "Download the original CI image"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ matrix.image-id }}
          run-id: ${{ needs.plan.outputs.source-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: /mnt
        if: matrix.image-source == 'artifact'
      - name: "Download the digest of the original CI image"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ matrix.image-id }}
          run-id: ${{ needs.plan.outputs.source-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: ${{ runner.temp }}/ci-image-digest
        if: matrix.image-source == 's3'
      # The tarball is the one the canary stashed, addressed by its digest as in
      # .github/actions/stash-restore, so a later build on `main` cannot replace it.
      - name: "Restore the original CI image from the RunsOn cache"
        shell: bash
        run: |
          set -euo pipefail
          digest="$(cat "${RUNNER_TEMP}/ci-image-digest/sha256")"
          if [[ ! "${digest}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Malformed digest of the original CI image"
            exit 1
          fi
          export AWS_DEFAULT_REGION="${RUNS_ON_AWS_REGION:?not running on a RunsOn runner}"
          bucket="${RUNS_ON_S3_BUCKET_CACHE:?not running on a RunsOn runner}"
          object="s3://${bucket}/cache/airflow-stash/sha256/${digest}.tar"
          payload="${RUNNER_TEMP}/ci-image-stash.tar"
          aws s3 cp --only-show-errors "${object}" "${payload}"
          echo "${digest}  ${payload}" | sha256sum --check --status
          tar -tPf "${payload}" | while IFS= read -r entry; do
            if [[ "${entry}" != /mnt/* ]]; then
              echo "::error::The original CI image stash holds ${entry} outside /mnt"
              exit 1
            fi
          done
          tar -xPf "${payload}"
          rm -f "${payload}"
        if: matrix.image-source == 's3'
      - name: "Load the original CI image"
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: breeze ci-image load --platform linux/amd64 --python "${PYTHON_VERSION}" --image-file-dir /mnt
      - name: "Download the constraints used by the quick summary"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ matrix.inputs-id }}
          run-id: ${{ needs.plan.outputs.source-run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: files/dependency-report
      - name: "Explain outdated dependencies"
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          CONSTRAINTS_MODE: ${{ matrix.mode }}
          SOURCE_RUN_ID: ${{ needs.plan.outputs.source-run-id }}
          SOURCE_SHA: ${{ needs.plan.outputs.source-sha }}
        run: |
          {
            echo "## Dependency upgrade explanations"
            echo "Source canary run: ${SOURCE_RUN_ID}; source revision: ${SOURCE_SHA}"
            echo "Constraints commit: $(cat files/dependency-report/constraints-commit.txt)"
            echo "Python: ${PYTHON_VERSION}; mode: ${CONSTRAINTS_MODE}"
            echo "The constraints are the constraints branch the canary's summary checked, not ones built"
            echo "from the source revision: dependency bounds changed between the two can show up below as"
            echo "conflicts or as stale constraints."
          } >> "${GITHUB_STEP_SUMMARY}"
          breeze release-management constraints-version-check \
            --python "${PYTHON_VERSION}" --airflow-constraints-mode "${CONSTRAINTS_MODE}" \
            --constraints-file files/dependency-report/constraints.txt --explain-why \
            2>&1 | tee files/dependency-report/explanations.txt
      - name: "Save diagnostic output, including partial output on failure"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dependency-explanations-${{ matrix.python }}-${{ matrix.mode }}
          path: files/dependency-report/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
