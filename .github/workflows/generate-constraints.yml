---
name: Generate constraints
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      runners:
        description: "The array of labels (in json form) determining runners."
        required: true
        type: string
      platform:
        description: "Platform for the build - 'linux/amd64' or 'linux/arm64'"
        required: true
        type: string
      python-versions-list-as-string:
        description: "Stringified array of all Python versions to test - separated by spaces."
        required: true
        type: string
      python-versions:
        description: "JSON-formatted array of Python versions to generate constraints for"
        required: true
        type: string
      generate-no-providers-constraints:
        description: "Whether to generate constraints without providers (true/false)"
        required: true
        type: string
      generate-pypi-constraints:
        description: "Whether to generate PyPI constraints (true/false)"
        required: true
        type: string
      allow-pre-releases:
        description: >
          Whether the PyPI constraints may pin pre-release providers (true/false). Set when
          constraints are cut for a release candidate, whose providers are on PyPI only as rc
          versions. Scoped to apache-airflow-providers-* - no other package can resolve to a
          pre-release.
        required: false
        default: "false"
        type: string
      pypi-providers-only:
        description: >
          Resolve against providers exactly as published on PyPI (true/false). Skips building the
          provider distributions from sources and the source-providers constraints with them, so
          nothing local can answer for a provider. Set when the constraints being produced are the
          ones a release ships - see the comments on the steps this disables.
        required: false
        default: "false"
        type: string
      debug-resources:
        description: "Whether to run in debug mode (true/false)"
        required: true
        type: string
      use-uv:
        description: "Whether to use uvloop (true/false)"
        required: true
        type: string
      checkout-ref:
        description: "Commit-ish to checkout sources from (empty = workflow ref)."
        required: false
        default: ""
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        description: "Slack bot token used to post provider-downgrade alerts (optional)."
        required: false
jobs:
  generate-constraints-matrix:
    permissions:
      contents: read
    timeout-minutes: 70
    name: Generate constraints for ${{ matrix.python-version }} on ${{ inputs.platform }}
    runs-on: ${{ fromJSON(inputs.runners) }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    env:
      DEBUG_RESOURCES: ${{ inputs.debug-resources }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      INCLUDE_SUCCESS_OUTPUTS: "true"
      PYTHON_VERSION: ${{ matrix.python-version }}
      VERBOSE: "true"
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
      - name: "Checkout ${{ inputs.checkout-ref || github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.checkout-ref }}
          persist-credentials: false
      - name: "Install prek"
        uses: ./.github/actions/install-prek
        id: prek
        with:
          python-version: ${{ matrix.python-version }}
          platform: ${{ inputs.platform }}
          save-cache: false
      - name: "Prepare breeze & CI image: ${{ matrix.python-version }}"
        uses: ./.github/actions/prepare_breeze_and_image
        with:
          platform: ${{ inputs.platform }}
          python: ${{ matrix.python-version }}
          use-uv: ${{ inputs.use-uv }}
          make-mnt-writeable-and-cleanup: true
      # Resolves the providers from the sources in this checkout. Skipped for a release, which
      # ships only the PyPI constraints and must not have a source tree answer for a provider.
      - name: "Source constraints"
        shell: bash
        run: >
          breeze release-management generate-constraints
          --airflow-constraints-mode constraints-source-providers --answer yes
          --python "${PYTHON_VERSION}"
        if: inputs.pypi-providers-only != 'true'
      - name: "No providers constraints"
        shell: bash
        timeout-minutes: 25
        run: >
          breeze release-management generate-constraints
          --airflow-constraints-mode constraints-no-providers --answer yes
          --python "${PYTHON_VERSION}"
        if: inputs.generate-no-providers-constraints == 'true'
      # Builds the providers from sources into the dist directory the PyPI resolution reads through
      # `--find-links`, so a locally built wheel can answer for a provider and is then excluded from
      # the constraints. That is wanted while developing a provider that is not on PyPI yet; it is the
      # opposite of what a release wants, which is every provider pinned at its published version.
      - name: "Prepare updated provider distributions"
        shell: bash
        run: >
          breeze release-management prepare-provider-distributions
          --include-not-ready-providers --distribution-format wheel
        if: inputs.generate-pypi-constraints == 'true' && inputs.pypi-providers-only != 'true'
      - name: "Prepare airflow distributions"
        shell: bash
        run: >
          breeze release-management prepare-airflow-distributions --distribution-format wheel
        if: inputs.generate-pypi-constraints == 'true'
      - name: "Prepare task-sdk distribution"
        shell: bash
        run: >
          breeze release-management prepare-task-sdk-distributions --distribution-format wheel
        if: inputs.generate-pypi-constraints == 'true'
      - name: "PyPI constraints"
        shell: bash
        timeout-minutes: 25
        env:
          # Deliberately not named ALLOW_PRE_RELEASES: that is the option's own envvar, and having
          # both paths set it would make it unclear which one is in force. Empty on a normal run,
          # so the unquoted expansion below contributes no argument at all.
          PRE_RELEASE_FLAG: ${{ inputs.allow-pre-releases == 'true' && '--allow-pre-releases' || '' }}
        run: |
          breeze release-management generate-constraints --airflow-constraints-mode constraints \
            --answer yes --python "${PYTHON_VERSION}" ${PRE_RELEASE_FLAG}
        if: inputs.generate-pypi-constraints == 'true'
      - name: "Check for provider downgrade alert"
        id: downgrade-alert
        if: always() && inputs.generate-pypi-constraints == 'true'
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          message_file="files/constraints-${PYTHON_VERSION}/provider-downgrade-slack-message.json"
          if [[ -f "${message_file}" && -n "${SLACK_BOT_TOKEN}" ]]; then
            echo "notify=true" >> "${GITHUB_OUTPUT}"
            echo "message-file=${message_file}" >> "${GITHUB_OUTPUT}"
          else
            echo "notify=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: "Post provider downgrade alert to Slack"
        if: always() && steps.downgrade-alert.outputs.notify == 'true'
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c  # v3.0.3
        with:
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ${{ steps.downgrade-alert.outputs.message-file }}
      - name: "Upload constraint artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: constraints-${{ matrix.python-version }}
          path: ./files/constraints-${{ matrix.python-version }}/constraints-*.txt
          retention-days: 7
          if-no-files-found: error
      - name: "Dependency upgrade summary"
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          echo "Summarizing Python $PYTHON_VERSION"
          cat "files/constraints-${PYTHON_VERSION}"/*.md >> $GITHUB_STEP_SUMMARY || true
          df -H
