---
name: Build reusable main images for one platform
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      platform:
        description: Docker platform
        type: string
        required: true
      runners:
        description: Runner labels as JSON
        type: string
        required: true
      artifact-prefix:
        description: Architecture namespace for intermediate artifacts
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  ci-images:
    uses: ./.github/workflows/ci-image-build.yml
    with:
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      publish-main-image: true
      push-image: "false"
      upload-image-artifact: "true"
      upload-mount-cache-artifact: "false"
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      branch: main
      constraints-branch: constraints-main
      use-uv: "true"
      upgrade-to-newer-dependencies: "false"
      docker-cache: local
      disable-airflow-repo-cache: "false"
  constraints:
    needs: ci-images
    uses: ./.github/workflows/generate-constraints.yml
    with:
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      python-versions-list-as-string: '3.10 3.11 3.12 3.13 3.14'
      generate-pypi-constraints: "false"
      generate-no-providers-constraints: "false"
      debug-resources: "false"
      use-uv: "true"
  prod-images:
    needs: constraints
    uses: ./.github/workflows/prod-image-build.yml
    with:
      runners: ${{ inputs.runners }}
      platform: ${{ inputs.platform }}
      artifact-prefix: ${{ inputs.artifact-prefix }}
      publish-main-image: true
      build-type: Regular
      push-image: "false"
      upload-image-artifact: "true"
      upload-package-artifact: "true"
      python-versions: '["3.10", "3.11", "3.12", "3.13", "3.14"]'
      default-python-version: '3.10'
      branch: main
      constraints-branch: constraints-main
      use-uv: "true"
      upgrade-to-newer-dependencies: "false"
      docker-cache: local
      disable-airflow-repo-cache: "false"
      prod-image-build: "true"
