---
name: "Scheduled verify improvement proposals wiki"
on:  # yamllint disable-line rule:truthy
  schedule:
    # Daily at 06:30 UTC
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-improvement-proposals-wiki:
    name: "Verify AIP and ADIP wiki trees"
    if: github.event_name != 'schedule' || github.repository == 'apache/airflow'
    runs-on: ["ubuntu-slim"]
    timeout-minutes: 15
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Verify AIP and ADIP wiki trees"
        id: verify
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: >
          python3 scripts/ci/verify_improvement_proposals_wiki.py
          --slack-payload slack-message.json
          --run-url "${RUN_URL}"
      - name: "Notify Slack about the problems"
        if: failure() && hashFiles('slack-message.json') != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: "slack-message.json"
      # yamllint disable rule:line-length
      - name: "Notify Slack that the check could not run"
        if: failure() && hashFiles('slack-message.json') == ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: "internal-airflow-ci-cd"
            text: >-
              :warning: The AIP/ADIP wiki consistency check could not run.
              See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
