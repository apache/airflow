---
name: Clean up keyed image cache
# Deletes the keyed CI image cache tags (`cache-<platform>-<dependency key>`) not pushed for 30 days.
# See scripts/ci/cleanup_keyed_image_cache.py.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Only list what would be deleted"
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: cleanup-keyed-image-cache
  cancel-in-progress: false
jobs:
  cleanup:
    name: "Clean up keyed image cache"
    runs-on: ["ubuntu-slim"]
    permissions:
      contents: read
      packages: write
    if: github.repository == 'apache/airflow'
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Delete keyed cache older than 30 days"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        run: python3 scripts/ci/cleanup_keyed_image_cache.py --days 30 ${DRY_RUN}
