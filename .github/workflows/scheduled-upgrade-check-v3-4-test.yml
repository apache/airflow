---
name: "[v3-4-test] Scheduled CI upgrade check"
on:  # yamllint disable-line rule:truthy
  # Schedule paused while v3-4-test is fast-forwarded to main for the 3.4.0 betas - upgrades
  # land on main and reach v3-4-test with the next fast-forward. Re-enable when the 3.4.0
  # RCs start (see "Beta releases" in dev/README_RELEASE_AIRFLOW.md).
  # schedule:
  #   # Tue, Thu at 06:00 UTC — the days main does not run, so the two never overlap.
  #   - cron: '0 6 * * 2,4'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  upgrade-v3-4-test:
    name: "[v3-4-test] Upgrade"
    uses: ./.github/workflows/upgrade-check.yml
    with:
      target-branch: v3-4-test
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
