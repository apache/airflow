---
name: Upgrade check
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      target-branch:
        description: >-
          Branch to upgrade (e.g. 'main')
        required: true
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        description: "Slack bot token for notifications"
        required: true
permissions:
  contents: read
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  TARGET_BRANCH: ${{ inputs.target-branch }}
jobs:
  # Picks the runner of the upgrade the way CI does: RunsOn in apache/airflow, public runners in forks
  # or when the repository variable USE_PUBLIC_RUNNERS is "true".
  build-info:
    name: >-
      [${{ inputs.target-branch }}] Build info
    runs-on: ["ubuntu-slim"]
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      runner-type: ${{ steps.selective-checks.outputs.runner-type }}
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
        with:
          free-space: "false"
      - name: "Save github context to file"
        # Same as in ci-amd.yml: a scheduled or dispatched run has no attacker-controlled context, and
        # the single-quoted heredoc disables every shell expansion of the JSON anyway.
        shell: bash
        run: |  # zizmor: ignore[template-injection]
          cat > "${RUNNER_TEMP}/github_context.json" << '__GITHUB_CONTEXT_END__'
          ${{ toJson(github) }}
          __GITHUB_CONTEXT_END__
      - name: "Selective checks"
        id: selective-checks
        env:
          COMMIT_REF: "${{ github.sha }}"
          VERBOSE: "false"
          GITHUB_CONTEXT_INPUT: "${{ runner.temp }}/github_context.json"
          PLATFORM: "linux/amd64"
          USE_PUBLIC_RUNNERS: "${{ vars.USE_PUBLIC_RUNNERS }}"
        run: breeze ci selective-check 2>> ${GITHUB_OUTPUT}
  # A job of its own, so the token that may dispatch workflows never reaches the upgrade job, which
  # runs the third-party tools and hooks it upgrades. It only dispatches the mirror and waits for it.
  mirror-base-images:
    timeout-minutes: 30
    name: >-
      [${{ inputs.target-branch }}] Mirror hardened base images
    runs-on: ["ubuntu-slim"]
    permissions:
      actions: write
      contents: read
    steps:
      - name: >-
          [${{ inputs.target-branch }}] Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: >-
          [${{ inputs.target-branch }}] Install Breeze
        uses: ./.github/actions/breeze
        with:
          free-space: "false"
      # The upgrade for main is the one the mirror would otherwise start a second time.
      - name: >-
          [${{ inputs.target-branch }}] Mirror the base images and wait for the run
        env:
          TRIGGER_UPGRADE_CHECK_FLAG: >-
            ${{ inputs.target-branch == 'main' && '--no-trigger-upgrade-check' || '--trigger-upgrade-check' }}
        run: breeze workflow-run mirror-base-images "${TRIGGER_UPGRADE_CHECK_FLAG}"
  createupgrade-check:
    timeout-minutes: 45
    name: >-
      [${{ inputs.target-branch }}] Upgrade checks and PR
    # Builds the CI image for the uv.lock refresh and runs every hook, like the CI image builds.
    runs-on: ${{ format(fromJSON(needs.build-info.outputs.runner-type)[0], '8+16', '32+64') }}
    needs: [build-info, mirror-base-images]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: >-
          [${{ inputs.target-branch }}] Cleanup repo
        shell: bash
        run: >
          docker run -v "${GITHUB_WORKSPACE}:/workspace"
          -u 0:0 bash -c "rm -rf /workspace/*"
      - name: >-
          [${{ inputs.target-branch }}] Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.target-branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: >-
          [${{ inputs.target-branch }}] Configure git credentials
        run: |
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
      - name: >-
          [${{ inputs.target-branch }}] Install Breeze
        uses: ./.github/actions/breeze
        id: breeze
      - name: >-
          [${{ inputs.target-branch }}] Install prek
        uses: ./.github/actions/install-prek
        id: prek
        with:
          platform: "linux/amd64"
          save-cache: false
      - name: >-
          [${{ inputs.target-branch }}] Run breeze ci upgrade
        run: >
          breeze ci upgrade
          --target-branch "${TARGET_BRANCH}"
          --create-pr
          --draft
          --switch-to-base
          --no-k8s-schema-sync
          --latest-package-managers
          --no-mirror-base-images
          --answer yes
      - name: >-
          [${{ inputs.target-branch }}] Find upgrade PR
        id: find-pr
        run: |
          PR_URL=$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --head "ci-upgrade-${TARGET_BRANCH}" \
            --base "${TARGET_BRANCH}" \
            --state open \
            --json url \
            --jq '.[0].url' 2>/dev/null || true)
          echo "pr-url=${PR_URL}" >> "${GITHUB_OUTPUT}"
      - name: >-
          [${{ inputs.target-branch }}] Drop backport labels
        # breeze already removed these, but boring-cyborg labels on a webhook and can land
        # after it exits. Each branch upgrades itself on its own schedule, so a backport
        # would race that with a change conflicting on the files it regenerates.
        if: steps.find-pr.outputs.pr-url != ''
        env:
          PR_URL: ${{ steps.find-pr.outputs.pr-url }}
        run: |
          sleep 30
          mapfile -t LABELS < <(gh pr view "${PR_URL}" \
            --json labels \
            --jq '.labels[].name | select(startswith("backport-to-"))')
          if [[ ${#LABELS[@]} -eq 0 ]]; then
            echo "No backport labels to remove."
            exit 0
          fi
          ARGS=()
          for label in "${LABELS[@]}"; do
            ARGS+=(--remove-label "${label}")
          done
          gh pr edit "${PR_URL}" "${ARGS[@]}"
          echo "Removed: ${LABELS[*]}"
      - name: >-
          [${{ inputs.target-branch }}] Notify Slack on success
        if: success() && steps.find-pr.outputs.pr-url != ''
        uses: >-
          slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          payload: |
            channel: "internal-airflow-ci-cd"
            text: >-
              🔧 [${{ inputs.target-branch }}] Scheduled CI upgrade PR
              ready: ${{ steps.find-pr.outputs.pr-url }}
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: >-
                    🔧 *[${{ inputs.target-branch }}] Scheduled CI upgrade
                    PR ready*

                    A new CI upgrade PR has been created as a draft on the
                    `${{ inputs.target-branch }}` branch. Please:

                      1. *Undraft* the PR to trigger CI
                      2. *Review* the changes
                      3. *Merge* it once CI passes

                    <${{ steps.find-pr.outputs.pr-url }}|View PR>
      - name: >-
          [${{ inputs.target-branch }}] Notify Slack on failure
        if: failure()
        uses: >-
          slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          # yamllint disable rule:line-length
          payload: |
            channel: "internal-airflow-ci-cd"
            text: >-
              ⚠️ [${{ inputs.target-branch }}] Scheduled CI upgrade FAILED.
              See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: >-
                    ⚠️ *[${{ inputs.target-branch }}] Scheduled CI upgrade
                    FAILED*

                    The `breeze ci upgrade` job on the
                    `${{ inputs.target-branch }}` branch did not complete
                    successfully. Please investigate the failed run and
                    re-run the workflow if needed.

                    <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View failed run>
