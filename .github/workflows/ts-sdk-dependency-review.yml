---
name: TypeScript SDK dependency review

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    paths:
      - "ts-sdk/package.json"
      - "ts-sdk/pnpm-lock.yaml"
      - ".github/workflows/ts-sdk-dependency-review.yml"

permissions:
  contents: read

concurrency:
  group: ts-sdk-dependency-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Reject vulnerable dependency changes
    runs-on: ubuntu-slim
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          # GHSA-8mgp-746c-j5xp / CVE-2026-81726 - path traversal in nltk's
          # model-artifact save/load APIs, no released fix yet. nltk is a CI-only
          # transitive dependency (llama-index-core, pulled by the common.ai
          # provider's "llamaindex" extra); it is not in the released constraints
          # and none of the affected APIs are reachable from llama-index-core,
          # which only uses the Punkt tokenizer and the stopwords corpus. The fix
          # is merged on nltk's develop branch (nltk/nltk#3757, #3759, #3813) and
          # is waiting on a 3.10.4 release - drop this entry once that ships.
          allow-ghsas: GHSA-8mgp-746c-j5xp
