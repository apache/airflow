      platform: ${{ needs.build-info.outputs.platform }}
      default-python-version: "${{ needs.build-info.outputs.default-python-version }}"
      python-versions: ${{ needs.build-info.outputs.python-versions }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      canary-run: ${{ needs.build-info.outputs.canary-run }}
      distribution-name: "airflow-ctl"
      distribution-cmd-format: "prepare-airflow-ctl-distributions"
      test-type: "airflow-ctl-tests"
      use-local-venv: 'true'
      test-timeout: 20
    if: needs.build-info.outputs.run-airflow-ctl-tests == 'true'

  tests-agent-frameworks:
    name: "Agent framework tests"
    uses: ./.github/workflows/agent-framework-tests.yml
    needs: [build-info, build-ci-images]
    permissions:
      contents: read
      packages: read
    with:
      runners: ${{ format(needs.build-info.outputs.runner-type, '8+16', '32+64') }}
      platform: ${{ needs.build-info.outputs.platform }}
      default-python-version: "${{ needs.build-info.outputs.default-python-version }}"
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      canary-run: ${{ needs.build-info.outputs.canary-run }}
    # Not a dependency of finalize-tests: on a canary run the frameworks' own pins win, and a
    # breaking framework release should not stop finalize-tests from pushing the image cache.
    if: needs.build-info.outputs.run-agent-framework-tests == 'true'

  finalize-tests:
    name: Finalize tests
    permissions:
      contents: write
      packages: write
    # This will fire when all the jobs from "needs" are either successful or skipped
    # build-info is skipped by a no-op canary and when the fork CI gate leaves the pull request to
    # fork CI (AIP-120); every other need is then skipped too, which always() alone would treat as
    # success.
    if: always() && !failure() && !cancelled() && needs.build-info.result == 'success'
    needs:
      - additional-ci-image-checks
      - additional-prod-image-tests
      - basic-tests
      - build-info
      - build-prod-images
      - ci-image-checks
      - generate-constraints
      - migration-round-trip
      - mypy-providers
      - providers
      - tests-helm
      - tests-integration-system
      - tests-kubernetes
      - tests-mysql-core
      - tests-mysql-providers
      - tests-non-db-core
      - tests-non-db-providers
      - tests-postgres-core
      - tests-postgres-providers
      - tests-sqlite-core
      - tests-sqlite-providers
      - tests-task-sdk
      - tests-airflow-ctl
      - tests-go-sdk
      - tests-java-sdk
      - tests-ts-sdk
      - build-java-sdk-docs
      - build-ts-sdk-docs
      - tests-with-lowest-direct-resolution-core
      - tests-with-lowest-direct-resolution-providers
    uses: ./.github/workflows/finalize-tests.yml
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      python-versions: ${{ needs.build-info.outputs.python-versions }}
      python-versions-list-as-string: ${{ needs.build-info.outputs.python-versions-list-as-string }}
      branch: ${{ needs.build-info.outputs.default-branch }}
      constraints-branch: ${{ needs.build-info.outputs.default-constraints-branch }}
      default-python-version: "${{ needs.build-info.outputs.default-python-version }}"
      upgrade-to-newer-dependencies: ${{ needs.build-info.outputs.upgrade-to-newer-dependencies }}
      include-success-outputs: ${{ needs.build-info.outputs.include-success-outputs }}
      docker-cache: ${{ needs.build-info.outputs.docker-cache }}
      disable-airflow-repo-cache: ${{ needs.build-info.outputs.disable-airflow-repo-cache }}
      canary-run: ${{ needs.build-info.outputs.canary-run }}
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      debug-resources: ${{ needs.build-info.outputs.debug-resources }}

  check-timed-out-jobs:
    # A job-level `if` is the only place `cancelled()` tells a cancelled run from a job cancelled by
    # its timeout: the steps of `ci-passed` start after the cancellation. Its `needs` must match
    # those of `ci-passed`, so a timeout in any job fails the gate.
    name: "Check for timed-out CI jobs"
    if: always() && !cancelled() && contains(needs.*.result, 'cancelled')
    needs:
      - additional-ci-image-checks
      - additional-prod-image-tests
      - basic-tests
      - build-ci-images
      - build-info
      - build-java-sdk-docs
      - build-prod-images
      - build-ts-sdk-docs
      - check-run-needed
      - ci-image-checks
      - finalize-tests
      - gate
      - generate-constraints
      - migration-round-trip
      - mypy-providers
      - print-platform
      - providers
      - tests-agent-frameworks
      - tests-airflow-ctl
      - tests-go-sdk
      - tests-helm
      - tests-integration-system
      - tests-java-sdk
      - tests-kubernetes
      - tests-kustomize-overlays
      - tests-mysql-core
      - tests-mysql-providers
      - tests-non-db-core
      - tests-non-db-providers
      - tests-postgres-core
      - tests-postgres-providers
      - tests-special
      - tests-sqlite-core
      - tests-sqlite-providers
      - tests-task-sdk
      - tests-ts-sdk
      - tests-with-lowest-direct-resolution-core
      - tests-with-lowest-direct-resolution-providers
    runs-on: ["ubuntu-slim"]
    steps:
      - name: "Fail because a CI job was cancelled without the run being cancelled"
        run: |
          echo "A CI job was cancelled, likely by its timeout, while the run was not cancelled."
          exit 1

  ci-passed:
    # A skipped build-info means project CI did not run at all: the fork CI gate (AIP-120) left the
    # pull request to CI in the contributor's fork, and every job here is skipped. Reporting
    # "CI passed" then would let it merge on no CI, so the job reports under another name and
    # the fork CI reconciler posts "CI passed" from the fork run instead.
    # A run with cancelled jobs and no failed one -- usually a duplicate run of the same commit that
    # concurrency cancelled, such as the two `synchronize` events GitHub sends when a stacked pull
    # request's base and head are force-pushed together -- reports under another name too, so it
    # never puts a failed "CI passed" next to the passing one of its twin. "CI passed" is then
    # missing for that run, which keeps the merge blocked until another run of the commit reports it.
    # A job cancelled by its timeout, while the run is not, makes `check-timed-out-jobs` fail, and
    # so this job fails.
    name: >-
      ${{ (!contains(needs.*.result, 'failure') && contains(needs.*.result, 'cancelled') &&
      'CI passed (run cancelled)') ||
      (needs.build-info.result == 'skipped' && 'CI passed (project CI not run)') || 'CI passed' }}
    # The one check main's ruleset requires, so auto-merge waits for CI to finish. GitHub treats a
    # skipped required check as passed, so this job always runs and fails itself when any job it
    # needs failed or timed out. Jobs skipped by selective checks count as passed.
    if: always()
    needs:
      - additional-ci-image-checks
      - additional-prod-image-tests
      - basic-tests
      - build-ci-images
      - build-info
      - build-java-sdk-docs
      - build-prod-images
      - build-ts-sdk-docs
      - check-run-needed
      - check-timed-out-jobs
      - ci-image-checks
      - finalize-tests
      - gate
      - generate-constraints
      - migration-round-trip
      - mypy-providers
      - print-platform
      - providers
      - tests-agent-frameworks
      - tests-airflow-ctl
      - tests-go-sdk
      - tests-helm
      - tests-integration-system
      - tests-java-sdk
      - tests-kubernetes
      - tests-kustomize-overlays
      - tests-mysql-core
      - tests-mysql-providers
      - tests-non-db-core
      - tests-non-db-providers
      - tests-postgres-core
      - tests-postgres-providers
      - tests-special
      - tests-sqlite-core
      - tests-sqlite-providers
      - tests-task-sdk
      - tests-ts-sdk
      - tests-with-lowest-direct-resolution-core
      - tests-with-lowest-direct-resolution-providers
    runs-on: ["ubuntu-slim"]
    steps:
      - name: "Fail if any CI job failed"
        if: contains(needs.*.result, 'failure')
        run: |
          echo "At least one CI job failed."
          exit 1
      - name: "Report that CI jobs were cancelled"
        if: contains(needs.*.result, 'cancelled')
        run: |
          echo "At least one CI job was cancelled, so this run does not report CI passed."
          echo 'CI jobs were cancelled: this run does not report `CI passed`.' >> "${GITHUB_STEP_SUMMARY}"
      - name: "All CI jobs passed or were skipped"
        if: "!contains(needs.*.result, 'cancelled')"
        run: echo "All CI jobs passed or were skipped."

  notify-slack:
    name: "Notify Slack"
    needs:
      - build-info
      - check-run-needed
      # Waits for the gate job, which also fails when a CI job timed out.
      - ci-passed
      - finalize-tests
      - tests-agent-frameworks
    # A no-op canary (`run-needed` is 'false') does not post; a failed check does. A failing gate
    # skips build-info and everything after it, and must still be reported. A fork's scheduled run
    # is the intended skip, and forks have no Slack to report to.
    if: >-
      always() &&
      !cancelled() &&
      github.repository == 'apache/airflow' &&
      github.event_name == 'schedule' &&
      needs.check-run-needed.outputs.run-needed != 'false'
    runs-on: ["ubuntu-slim"]
    permissions:
      # The run's jobs, the previous notification state, and the annotations RunsOn puts on jobs
      # stopped by an EC2 Spot interruption.
      actions: read
      checks: read
      contents: read
    steps:
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Skips re-runs started by maintainers, and failures that are only EC2 Spot interruptions
      # RunsOn will re-run; those leave the notification state alone, and the re-run reports.
      - name: "Get failing jobs"
        id: get-failures
        shell: bash
        run: python3 scripts/ci/spot_interruptions.py slack
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      - name: "Determine notification action"
        id: notification
        if: steps.get-failures.outputs.skip != 'true'
        shell: bash
        run: |
          command -v gh >/dev/null 2>&1 || { echo "::error::gh CLI is not installed"; exit 1; }
          gh auth status || gh auth login --with-token <<< "${GITHUB_TOKEN}"
          python3 scripts/ci/slack_notification_state.py
        env:
          ARTIFACT_NAME: "slack-state-tests-${{ github.ref_name }}-amd"
          CURRENT_FAILURES: "${{ steps.get-failures.outputs.failed-jobs }}"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: "Upload notification state"
        if: steps.get-failures.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: "slack-state-tests-${{ github.ref_name }}-amd"
          path: ./slack-state/
          retention-days: 7
          overwrite: true
      - name: "Notify Slack (new/changed failures)"
        if: steps.notification.outputs.action == 'notify_new'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          # yamllint disable rule:line-length
          payload: |
            channel: "internal-airflow-ci-cd"
            text: "🚨 Failure Alert: Scheduled CI (${{ needs.build-info.outputs.platform }}) on branch *${{ github.ref_name }}*\n\nFailing jobs:\n${{ steps.get-failures.outputs.failed-jobs-text }}\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the failure log>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🚨 Failure Alert: Scheduled CI (${{ needs.build-info.outputs.platform }}) on *${{ github.ref_name }}*\n\nFailing jobs:\n${{ steps.get-failures.outputs.failed-jobs-text }}\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the failure log>"
          # yamllint enable rule:line-length
      - name: "Notify Slack (still not fixed)"
        if: steps.notification.outputs.action == 'notify_reminder'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          # yamllint disable rule:line-length
          payload: |
            channel: "internal-airflow-ci-cd"
            text: "🚨🔁 Still not fixed: Scheduled CI (${{ needs.build-info.outputs.platform }}) on branch *${{ github.ref_name }}*\n\nFailing jobs:\n${{ steps.get-failures.outputs.failed-jobs-text }}\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the failure log>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "🚨🔁 Still not fixed: Scheduled CI (${{ needs.build-info.outputs.platform }}) on *${{ github.ref_name }}*\n\nFailing jobs:\n${{ steps.get-failures.outputs.failed-jobs-text }}\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the failure log>"
          # yamllint enable rule:line-length
      - name: "Notify Slack (all tests passing)"
        if: steps.notification.outputs.action == 'notify_recovery'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ env.SLACK_BOT_TOKEN }}
          # yamllint disable rule:line-length
          payload: |
            channel: "internal-airflow-ci-cd"
            text: "✅ All tests passing: Scheduled CI (${{ needs.build-info.outputs.platform }}) on branch *${{ github.ref_name }}*\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run log>"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "✅ All tests passing: Scheduled CI (${{ needs.build-info.outputs.platform }}) on *${{ github.ref_name }}*\n\n*Details:* <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the run log>"
          # yamllint enable rule:line-length

  summarize-warnings:
    timeout-minutes: 15
    name: "Summarize warnings"
    needs:
      - build-info
      - tests-mysql-core
      - tests-mysql-providers
      - tests-non-db-core
      - tests-non-db-providers
      - tests-postgres-core
      - tests-postgres-providers
      - tests-sqlite-core
      - tests-sqlite-providers
      - tests-task-sdk
      - tests-airflow-ctl
      - tests-special
      - tests-with-lowest-direct-resolution-core
      - tests-with-lowest-direct-resolution-providers
    runs-on: ${{ format(fromJSON(needs.build-info.outputs.runner-type)[0], '8+16', '32+64') }}
    if: needs.build-info.outputs.run-unit-tests == 'true'
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
      - name: "Checkout ${{ github.ref }} ( ${{ github.sha }} )"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "RunsOn cost summary"
        uses: ./.github/actions/runs-on-cost-summary
      - name: "Free up disk space"
        shell: bash
        run: ./scripts/tools/free_up_disk_space.sh
      - name: "Download all test warning artifacts from the current build"
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ./artifacts
          pattern: test-warnings-*
      - name: "Setup python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "${{ inputs.default-python-version }}"
      - name: "Summarize all warnings"
        run: |
          ./scripts/ci/testing/summarize_captured_warnings.py ./artifacts \
            --pattern "**/warnings-*.txt" \
            --output ./files
      - name: "Upload artifact for summarized warnings"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: "test-summarized-warnings"
          path: ./files/warn-summary-*.txt
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
