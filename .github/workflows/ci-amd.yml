      helm-test-packages: ${{ needs.build-info.outputs.helm-test-packages }}
      helm-test-kubernetes-versions: ${{ needs.build-info.outputs.helm-test-kubernetes-versions }}
      default-python-version: "${{ needs.build-info.outputs.default-python-version }}"
      use-uv: ${{ needs.build-info.outputs.use-uv }}
    if: >
      needs.build-info.outputs.run-helm-tests == 'true' &&
      needs.build-info.outputs.default-branch == 'main' &&
      needs.build-info.outputs.latest-versions-only != 'true'

  tests-kustomize-overlays:
    name: "Kustomize overlays smoke tests"
    uses: ./.github/workflows/kustomize-overlays-tests.yml
    needs: [build-info, build-prod-images]
    permissions:
      contents: read
      packages: read
    with:
      runners: ${{ needs.build-info.outputs.runner-type }}
      platform: ${{ needs.build-info.outputs.platform }}
      default-python-version: "${{ needs.build-info.outputs.default-python-version }}"
      use-uv: ${{ needs.build-info.outputs.use-uv }}
      overlays: ${{ needs.build-info.outputs.kustomize-overlay-names }}
    # Gated by run-kustomize-overlays-tests (computed by SelectiveChecks
    # from changes under chart/kustomize-overlays/ and the narrow set of
    # runner files), NOT by run-helm-tests — a values.yaml tweak should
    # not pull in a 30-40 min kind cluster spin-up for unrelated overlays.
    # AMD-only via the platform guard below: the smoke test is
    # CPU-architecture-neutral (kustomize render + apply + STATUS
    # verify-block) and the overlays' third-party images (e.g.
    # gcavalcante8808/krb5-server) are not published for arm64, so running it
    # on the ARM lane would only add cost and arch-specific flakes for no
    # extra signal. The job stays defined in both ci-arm.yml/ci-amd.yml (kept
    # in sync) and is skipped on ARM through build-info.platform, mirroring
    # the tests-unit-* jobs.
    if: >
      needs.build-info.outputs.run-kustomize-overlays-tests == 'true' &&
      needs.build-info.outputs.default-branch == 'main' &&
      needs.build-info.outputs.latest-versions-only != 'true' &&
      needs.build-info.outputs.kustomize-overlay-names != '[]' &&
      needs.build-info.outputs.platform == 'linux/amd64'


