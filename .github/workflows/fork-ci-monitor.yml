---
# Drives pull requests whose CI runs in contributor forks (AIP-120): labels, draft state, the
# state comment, the `Fork CI / Tests (AMD)` commit status and closing. It is the only writer for
# those pull requests, and deletes their project CI runs that only skipped every job. It never checks
# out or runs pull request code. See
# dev/breeze/doc/ci/08_fork_ci_for_external_contributors.md.
#
# Part of the fork CI gate: a pull request whose CI runs in the contributor's fork and changes
# this file is closed by this monitor ("Gate protection" in the document above).
name: "Fork CI monitor"
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Compute the changes without applying them to pull requests"
        type: boolean
        default: false
permissions: {}
concurrency:
  group: fork-ci-monitor
  cancel-in-progress: false

jobs:
  reconcile:
    name: "Reconcile pull requests gated to fork CI"
    if: github.repository == 'apache/airflow'
    permissions:
      # Listing the runs and jobs of the gate tampering check, and deleting the runs that only
      # gated a pull request to fork CI.
      actions: write
      contents: read
      # Labels, comments and closing of gated pull requests.
      pull-requests: write
      # The `Fork CI / Tests (AMD)` commit status on pull request head commits.
      statuses: write
    outputs:
      draft-changes: ${{ steps.reconcile.outputs.draft-changes }}
    # The breeze action frees disk space with sudo and docker, which ubuntu-slim does not provide.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # What earlier runs reported, so that a problem that persists is posted to Slack once
      # rather than every 15 minutes. Losing it, for example to cache eviction, re-posts once.
      # Restored before anything that can fail, so a failing setup is reported once too, and
      # outside the checkout, where nothing but the steps below reads it.
      - name: "Restore what earlier runs reported"
        id: restore-reported
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-ci-monitor
          key: fork-ci-monitor-reported-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fork-ci-monitor-reported-
      - name: "Checkout main"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
      # The reconciler updates a working copy; it replaces the recorded one only once Slack has
      # the message, so a failed post is retried by the next run instead of being suppressed.
      - name: "Reconcile"
        id: reconcile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run && 'true' || 'false' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp "${RUNNER_TEMP}/fork-ci-monitor/reported.json" reported.json 2>/dev/null || true
          breeze ci fork-ci-reconcile --output-file slack-message.json --reported-file reported.json \
            --draft-changes-file draft-changes.json
          echo "draft-changes=$(jq -c . draft-changes.json)" >> "${GITHUB_OUTPUT}"
      # A dry run reports what it would have done, which must not read as done on Slack.
      - name: "Post to Slack"
        id: post
        if: steps.reconcile.outputs.has-alerts == 'true' && !inputs.dry-run
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          # Fail the step on a rejected post, so it is not recorded as reported.
          errors: true
          payload-file-path: "slack-message.json"
      - name: "Record what this run reported"
        if: steps.reconcile.outcome == 'success' && steps.post.outcome != 'failure' && !inputs.dry-run
        run: |
          mkdir -p "${RUNNER_TEMP}/fork-ci-monitor"
          cp reported.json "${RUNNER_TEMP}/fork-ci-monitor/reported.json"
          rm -f "${RUNNER_TEMP}/fork-ci-monitor/failed"
      # A run that fails before writing its message, for example on a discovery query or a rate
      # limit it cannot wait out, would otherwise stay silent. Only the first of consecutive failed
      # runs is reported.
      - name: "Check whether the previous run's failure was reported"
        id: previous-failure
        if: failure() && !inputs.dry-run
        run: |
          if [[ -f "${RUNNER_TEMP}/fork-ci-monitor/failed" ]]; then
            echo "reported=true" >> "${GITHUB_OUTPUT}"
          else
            echo "reported=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: "Report a failed run to Slack"
        id: report-failure
        if: failure() && !inputs.dry-run && steps.previous-failure.outputs.reported == 'false'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "internal-airflow-ci-cd"
            text: >-
              Fork CI monitor run failed:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: "Record the reported failure"
        if: failure() && steps.report-failure.outcome == 'success'
        run: mkdir -p "${RUNNER_TEMP}/fork-ci-monitor" && touch "${RUNNER_TEMP}/fork-ci-monitor/failed"
      # A dry run posts nothing, so what it saw must not suppress the next run's message.
      - name: "Save what was reported"
        if: always() && !inputs.dry-run && steps.restore-reported.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-ci-monitor
          key: fork-ci-monitor-reported-${{ github.run_id }}-${{ github.run_attempt }}

  # GitHub authorises the convertPullRequestToDraft and markPullRequestReadyForReview mutations
  # against `contents`, not `pull-requests`: with `contents: read` they fail with "Resource not
  # accessible by integration". `contents: write` would also let the token push to the
  # repository, so it is kept out of the reconcile job, which installs and runs Breeze and its
  # dependencies. This job runs no code but `gh` and `jq` on the reconciler's list.
  draft-state:
    name: "Change the draft state of pull requests gated to fork CI"
    needs: reconcile
    # Runs whenever the reconciler wrote its list, even when only its Slack post failed, and with
    # an empty list too, so that a failure set that cleared is recorded as cleared.
    if: >-
      !cancelled() && !inputs.dry-run && github.repository == 'apache/airflow'
      && needs.reconcile.outputs.draft-changes != ''
    permissions:
      contents: write
      # The draft state, and removing `fork ci required` from a released pull request once it
      # is undrafted.
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The pull requests whose change failed last time, so a persisting failure is posted to
      # Slack once, as in the reconcile job.
      - name: "Restore the previously failed changes"
        id: restore-failed
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-ci-draft-state
          key: fork-ci-monitor-draft-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fork-ci-monitor-draft-state-
      - name: "Change the draft state"
        id: change
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRAFT_CHANGES: ${{ needs.reconcile.outputs.draft-changes }}
        run: |
          failed=()
          while IFS=$'\t' read -r number node_id draft release; do
            # This token can push to the repository; act only on well-formed entries.
            if [[ ! "${number}" =~ ^[0-9]+$ || ! "${node_id}" =~ ^PR_[A-Za-z0-9_-]+$ \
                || ! "${draft}" =~ ^(true|false)$ || ! "${release}" =~ ^(true|false)$ ]]; then
              echo "::error::Skipped a malformed draft change"
              failed+=("malformed")
              continue
            fi
            if [[ "${draft}" == "true" ]]; then
              mutation="convertPullRequestToDraft"
            else
              mutation="markPullRequestReadyForReview"
            fi
            echo "#${number}: ${mutation}"
            if ! gh api graphql -f id="${node_id}" -f query="mutation(\$id: ID!) {
                ${mutation}(input: {pullRequestId: \$id}) { clientMutationId } }" > /dev/null; then
              failed+=("${number}")
              continue
            fi
            # The label brings the pull request back to the reconciler, which retries the
            # undraft while it is there.
            label="repos/${REPO}/issues/${number}/labels/fork%20ci%20required"
            if [[ "${release}" == "true" ]] && ! gh api -X DELETE "${label}" > /dev/null; then
              failed+=("${number}")
            fi
          done < <(jq -r '.[] | [.number, .node_id, .draft, .release] | @tsv' <<< "${DRAFT_CHANGES}")
          mkdir -p "${RUNNER_TEMP}/fork-ci-draft-state"
          printf '%s\n' "${failed[@]}" | sort -n | sed '/^$/d' > failed.txt
          previous="${RUNNER_TEMP}/fork-ci-draft-state/failed.txt"
          if [[ -s failed.txt ]] && ! cmp -s failed.txt "${previous}"; then
            echo "new-failures=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "failed=$(paste -sd, failed.txt)" >> "${GITHUB_OUTPUT}"
      - name: "Post failed changes to Slack"
        id: post
        if: steps.change.outputs.new-failures == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d  # v4.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          errors: true
          payload: |
            channel: "internal-airflow-ci-cd"
            text: >-
              Fork CI monitor could not change the draft state of pull requests
              ${{ steps.change.outputs.failed }}:
              ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - name: "Record the failed changes"
        if: steps.change.outcome == 'success' && steps.post.outcome != 'failure'
        run: cp failed.txt "${RUNNER_TEMP}/fork-ci-draft-state/failed.txt"
      - name: "Save the failed changes"
        if: always() && steps.restore-failed.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/fork-ci-draft-state
          key: fork-ci-monitor-draft-state-${{ github.run_id }}-${{ github.run_attempt }}
