---
name: Build PROD images
on:  # yamllint disable-line rule:truthy
  workflow_call:
    inputs:
      publish-main-image:
        description: "Publish verified images for the dedicated main publisher"
        type: boolean
        default: false
      artifact-prefix:
        description: "Namespace package and constraint artifacts when publishing multiple architectures"
        type: string
        default: ""
      runners:
        description: "The array of labels (in json form) determining runners."
        required: true
        type: string
      build-type:
        description: >
          Name of the 'type' of the build - usually 'Regular' but other types are used to test image
          variations.
        required: true
        type: string
      upload-package-artifact:
        description: >
          Whether to upload package artifacts (true/false). If false, the job will rely on artifacts prepared
          by the main prod-image build job.
        required: true
        type: string
      target-commit-sha:
        description: "The commit SHA to checkout for the build"
        required: false
        default: ""
        type: string
      pull-request-target:
        description: "Whether we are running this from pull-request-target workflow (true/false)"
        required: false
        default: "false"
        type: string
      is-committer-build:
        description: "Whether the build is executed by committer (true/false)"
        required: false
        default: "false"
        type: string
      push-image:
        description: "Whether to push image to the registry (true/false)"
        required: true
        type: string
      upload-image-artifact:
        description: "Whether to upload docker image artifact"
        required: false
        default: "false"
        type: string
      debian-version:
        description: "Base Debian distribution to use for the build (bookworm)"
        type: string
        default: "bookworm"
      install-mysql-client-type:
        description: "MySQL client type to use during build (mariadb/mysql)"
        type: string
        default: "mariadb"
      use-uv:
        description: "Whether to use uv to build the image (true/false)"
        required: true
        type: string
      python-versions:
        description: "JSON-formatted array of Python versions to build images from"
        required: true
        type: string
        default: '[""]'
      default-python-version:
        description: "Which version of python should be used by default"
        required: true
        type: string
      platform:
        description: "Platform for the build - 'linux/amd64' or 'linux/arm64'"
        required: true
        type: string
      branch:
        description: "Branch used to run the CI jobs in (main/v*_*_test)."
        required: true
        type: string
      constraints-branch:
        description: "Branch used to construct constraints URL from."
        required: true
        type: string
      upgrade-to-newer-dependencies:
        description: "Whether to attempt to upgrade image to newer dependencies (true/false)"
        required: true
        type: string
      docker-cache:
        description: "Docker cache specification to build the image (registry, local, disabled)."
        required: true
        type: string
      disable-airflow-repo-cache:
        description: "Disable airflow repo cache read from main."
        required: true
        type: string
      prod-image-build:
        description: "Whether this is a prod-image build (true/false)"
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  build-prod-packages:
    name: "Build Airflow and provider distributions"
    timeout-minutes: 10
    runs-on: ${{ fromJSON(inputs.runners) }}
    if: inputs.prod-image-build == 'true'
    env:
      PYTHON_MAJOR_MINOR_VERSION: "${{ inputs.default-python-version }}"
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
        if: inputs.upload-package-artifact == 'true'
      - name: "Checkout target branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Make /mnt writeable"
        run: ./scripts/ci/make_mnt_writeable.sh
        if: inputs.upload-package-artifact == 'true'
      - name: "Move docker to /mnt"
        run: ./scripts/ci/move_docker_to_mnt.sh
        if: inputs.upload-package-artifact == 'true'
      - name: "Cleanup dist and context file"
        shell: bash
        run: rm -fv ./dist/* ./docker-context-files/*
        if: inputs.upload-package-artifact == 'true'
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
        if: inputs.upload-package-artifact == 'true'
      - name: "Install prek"
        uses: ./.github/actions/install-prek
        id: prek
        with:
          platform: ${{ inputs.platform }}
          save-cache: false
        if: inputs.upload-package-artifact == 'true'
      - name: "Prepare providers packages - all providers built from sources"
        shell: bash
        run: >
          breeze release-management prepare-provider-distributions
          --distributions-list-file ./prod_image_installed_providers.txt
          --distribution-format wheel --include-not-ready-providers --skip-tag-check
        if: >
          inputs.upload-package-artifact == 'true' && inputs.branch == 'main'
      - name: "Prepare providers packages with only new versions of providers"
        shell: bash
        run: >
          breeze release-management prepare-provider-distributions
          --distributions-list-file ./prod_image_installed_providers.txt
          --distribution-format wheel --include-not-ready-providers
        if: >
          inputs.upload-package-artifact == 'true' && inputs.branch != 'main'
      - name: "Prepare airflow package"
        shell: bash
        run: >
          breeze release-management prepare-airflow-distributions --distribution-format wheel
        if: inputs.upload-package-artifact == 'true'
      - name: "Prepare task-sdk package"
        shell: bash
        run: >
          breeze release-management prepare-task-sdk-distributions --distribution-format wheel
        if: inputs.upload-package-artifact == 'true'
      - name: "Prepare airflow-ctl package"
        shell: bash
        run: >
          breeze release-management prepare-airflow-ctl-distributions --distribution-format wheel
        if: inputs.upload-package-artifact == 'true'
      - name: "Upload prepared packages as artifacts"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ inputs.artifact-prefix }}prod-packages
          # Publisher intermediates stay within this run; replacement also permits partial reruns.
          overwrite: ${{ inputs.artifact-prefix != '' }}
          path: ./dist
          retention-days: 7
          if-no-files-found: error
        if: inputs.upload-package-artifact == 'true'

  build-prod-images:
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    timeout-minutes: 80
    name: "Build PROD ${{ inputs.build-type }} image ${{ matrix.python-version }}"
    runs-on: ${{ fromJSON(inputs.runners) }}
    needs:
      - build-prod-packages
    env:
      BACKEND: sqlite
      PYTHON_MAJOR_MINOR_VERSION: "${{ matrix.python-version }}"
      DEFAULT_BRANCH: ${{ inputs.branch }}
      DEFAULT_CONSTRAINTS_BRANCH: ${{ inputs.constraints-branch }}
      INCLUDE_NOT_READY_PROVIDERS: "true"
      # You can override CONSTRAINTS_GITHUB_REPOSITORY by setting secret in your repo but by default the
      # Airflow one is going to be used
      CONSTRAINTS_GITHUB_REPOSITORY: >-
        ${{ secrets.CONSTRAINTS_GITHUB_REPOSITORY != '' &&
        secrets.CONSTRAINTS_GITHUB_REPOSITORY || 'apache/airflow' }}
      # In builds from forks, this token is read-only. For scheduled/direct push it is WRITE one
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_USERNAME: ${{ github.actor }}
      PLATFORM: ${{ inputs.platform }}
      VERBOSE: "true"
    steps:
      - name: "Cleanup repo"
        shell: bash
        run: sudo rm -rf ${GITHUB_WORKSPACE}/*
      - name: "Checkout target branch"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: "Install Breeze"
        uses: ./.github/actions/breeze
      - name: "Download constraints"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}constraints-${{ matrix.python-version }}
          path: ./docker-context-files/constraints-${{ matrix.python-version }}
      - name: "Resolve compatible main PROD image"
        id: main-image
        if: inputs.publish-main-image
        uses: ./.github/actions/resolve_main_image
        with:
          kind: prod
          constraints-file: "docker-context-files/constraints-${{ matrix.python-version }}\
            /constraints-source-providers-${{ matrix.python-version }}.txt"
          publish: ${{ inputs.publish-main-image }}
          python: ${{ matrix.python-version }}
          platform: ${{ inputs.platform }}
          disabled: "true"
      - name: "Make /mnt writeable"
        run: ./scripts/ci/make_mnt_writeable.sh
      - name: "Cleanup dist and context file"
        shell: bash
        run: rm -fv ./dist/* ./docker-context-files/*.whl
      - name: "Download packages prepared as artifacts"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: ${{ inputs.artifact-prefix }}prod-packages
          path: ./docker-context-files
      - name: "Resolve reusable production dependency layers"
        id: dependency-cache
        if: inputs.publish-main-image
        uses: ./.github/actions/resolve_main_image
        with:
          kind: prod-dependencies
          base-image: ${{ steps.main-image.outputs.base-image }}
          publish: ${{ inputs.publish-main-image }}
          python: ${{ matrix.python-version }}
          platform: ${{ inputs.platform }}
          disabled: "true"
      - name: "Configure production dependency cache"
        if: >-
          inputs.build-type == 'Regular' &&
          inputs.publish-main-image && inputs.docker-cache != 'disabled' &&
          inputs.upgrade-to-newer-dependencies != 'true' && inputs.use-uv == 'true'
        shell: bash
        env:
          CACHE_RESTORED: "false"
          PUBLISH_CACHE: ${{ inputs.publish-main-image }}
        run: ./scripts/ci/configure_prod_image_cache.sh
      - name: "Show downloaded files"
        run: ls -R ./docker-context-files
      - name: "Show constraints"
        run: |
          for file in ./docker-context-files/constraints*/constraints*.txt
          do
            echo "=== ${file} ==="
            echo
            cat ${file}
            echo
            echo "=== END ${file} ==="
          done
      - name: "Login to ghcr.io"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u ${ACTOR} --password-stdin
      - name: "Build PROD images w/ source providers ${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        shell: bash
        run: >
          breeze prod-image build
          --builder airflow_cache
          --commit-sha "${{ github.sha }}"
          --install-distributions-from-context
          --airflow-constraints-mode constraints-source-providers
          --use-constraints-for-context-distributions
        env:
          PYTHON_IMAGE: >-
            ${{ steps.main-image.outputs.base-image || steps.dependency-cache.outputs.base-image }}
          PUSH: ${{ inputs.push-image }}
          DOCKER_CACHE: ${{ inputs.docker-cache }}
          DISABLE_AIRFLOW_REPO_CACHE: ${{ inputs.disable-airflow-repo-cache }}
          DEBIAN_VERSION: ${{ inputs.debian-version }}
          INSTALL_MYSQL_CLIENT_TYPE: ${{ inputs.install-mysql-client-type }}
          UPGRADE_TO_NEWER_DEPENDENCIES: ${{ inputs.upgrade-to-newer-dependencies }}
          INCLUDE_NOT_READY_PROVIDERS: "true"
          USE_UV: ${{ inputs.use-uv }}
      - name: "Verify PROD image ${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        run: breeze prod-image verify
      - name: "Export PROD docker image ${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        env:
          PLATFORM: ${{ inputs.platform }}
        run: >
          breeze prod-image save --platform "${PLATFORM}" --image-file-dir "/mnt"
        if: inputs.upload-image-artifact == 'true'
      - name: "Stash PROD docker image ${{ env.PYTHON_MAJOR_MINOR_VERSION }}"
        uses: apache/infrastructure-actions/stash/save@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # save/v1.0.0
        with:
          key: prod-image-save-v3-${{ inputs.platform }}-${{ env.PYTHON_MAJOR_MINOR_VERSION }}
          path: "/mnt/prod-image-save-*-${{ env.PYTHON_MAJOR_MINOR_VERSION }}.tar"
          if-no-files-found: 'error'
          retention-days: '2'
        if: >-
          inputs.upload-image-artifact == 'true'
      - name: "Publish verified main PROD image"
        if: >-
          inputs.publish-main-image && steps.main-image.outputs.publication-exists != 'true' &&
          github.repository == 'apache/airflow' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.main-image.outputs.artifact-name }}
          path: /mnt/prod-image-save-*-${{ matrix.python-version }}.tar
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
      - name: "Publish verified production dependency layers"
        if: >-
          inputs.publish-main-image && steps.dependency-cache.outputs.publication-exists != 'true' &&
          github.repository == 'apache/airflow' &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.dependency-cache.outputs.artifact-name }}
          path: /mnt/prod-dependencies-cache-out
          compression-level: 6
          retention-days: 7
          if-no-files-found: error
