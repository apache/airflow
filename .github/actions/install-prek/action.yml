---
name: 'Install prek'
description: 'Installs prek and related packages'
inputs:
  save-cache:
    description: "Whether to save prek cache"
    required: true
  platform:
    description: 'Platform for the build - linux/amd64 or linux/arm64'
    required: true
runs:
  using: "composite"
  steps:
    - name: "Extract uv and prek versions from uv.lock"
      id: versions
      shell: bash
      # The uv.lock format is stable: the line immediately after `name = "<pkg>"`
      # is `version = "<X.Y.Z>"` for that package.
      run: |
        UV_VERSION=$(sed -n '/^name = "uv"$/{n;s/^version = "\(.*\)"$/\1/p;}' uv.lock)
        PREK_VERSION=$(sed -n '/^name = "prek"$/{n;s/^version = "\(.*\)"$/\1/p;}' uv.lock)
        if [[ -z "${UV_VERSION}" || -z "${PREK_VERSION}" ]]; then
          echo "Failed to extract uv (${UV_VERSION}) or prek (${PREK_VERSION}) version from uv.lock" >&2
          exit 1
        fi
        echo "Extracted uv==${UV_VERSION}, prek==${PREK_VERSION}"
        echo "uv-version=${UV_VERSION}" >> "${GITHUB_OUTPUT}"
        echo "prek-version=${PREK_VERSION}" >> "${GITHUB_OUTPUT}"
    - name: "Compute prek cache key"
      id: cache-key
      shell: bash
      # Built here rather than assembled from a version each caller formats for itself, which is how
      # the readers ended up asking for keys no job had ever saved under. uv resolves the hook
      # environments against the Python on PATH, so callers must run this after Breeze sets it up.
      env:
        PLATFORM: ${{ inputs.platform }}
        UV_VERSION: ${{ steps.versions.outputs.uv-version }}
        PREK_VERSION: ${{ steps.versions.outputs.prek-version }}
        PREK_CONFIG_HASH: ${{ hashFiles('**/.pre-commit-config.yaml') }}
      run: |
        PYTHON_VERSION=$(python3 -c 'import platform; print(platform.python_version())')
        KEY="cache-prek-v12-${PLATFORM}-python${PYTHON_VERSION}-uv${UV_VERSION}-prek${PREK_VERSION}-${PREK_CONFIG_HASH}"
        echo "Prek cache key: ${KEY}"
        echo "key=${KEY}" >> "${GITHUB_OUTPUT}"
    - name: "Install uv"
      shell: bash
      run: pip install "uv==${UV_VERSION}"
      env:
        UV_VERSION: ${{ steps.versions.outputs.uv-version }}
    - name: Install prek
      shell: bash
      env:
        UV_VERSION: ${{ steps.versions.outputs.uv-version }}
        PREK_VERSION: ${{ steps.versions.outputs.prek-version }}
      run: |
        uv tool install prek==${PREK_VERSION} --with uv==${UV_VERSION}
      working-directory: ${{ github.workspace }}
    # The stash contains only prek's cache. Preserve unrelated host caches (uv/pip/etc.) so later
    # setup in the same job does not needlessly download them again.
    - name: "Clear local prek cache before restore"
      run: |
        rm -rf ~/.cache/prek
        # Do not mistake a leftover tarball from an earlier invocation for this key's payload.
        rm -f /tmp/cache-prek.tar.gz
      shell: bash
    - name: "Restore prek cache"
      # yamllint disable-line rule:line-length
      uses: apache/infrastructure-actions/stash/restore@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # restore/v1.0.0
      with:
        key: ${{ steps.cache-key.outputs.key }}
        path: /tmp/
      id: restore-prek-cache
    - name: "Restore .cache from the tar file"
      id: restore-prek-tar
      shell: bash
      run: |
        started_at=${SECONDS}
        if [ ! -f /tmp/cache-prek.tar.gz ]; then
          echo "❌ Cache tarball missing. Expected /tmp/cache-prek.tar.gz"
          echo "tar-restored=false" >> "${GITHUB_OUTPUT}"
          exit 0
        fi
        if tar -C "${HOME}" -xzf /tmp/cache-prek.tar.gz && [[ -d "${HOME}/.cache/prek" ]]; then
          echo "✅ Cache tarball extracted successfully"
          echo "tar-restored=true" >> "${GITHUB_OUTPUT}"
          echo "duration-seconds=$((SECONDS - started_at))" >> "${GITHUB_OUTPUT}"
        else
          echo "⚠️ Cache tarball extraction failed — treating as cache miss"
          echo "tar-restored=false" >> "${GITHUB_OUTPUT}"
          rm -rf ~/.cache/prek
        fi
      if: steps.restore-prek-cache.outputs.stash-hit == 'true'
    - name: "Make sure cache is cleared on cache miss"
      run: rm -rf ~/.cache/prek
      shell: bash
      if: >
        steps.restore-prek-cache.outputs.stash-hit != 'true'
        || steps.restore-prek-tar.outputs.tar-restored != 'true'
    - name: Validate and install prek hooks
      id: install-hooks
      shell: bash
      # A successfully extracted archive can still contain a partial or unusable environment.
      # This is idempotent on a healthy hit; prek validates/reuses it and repairs misses normally.
      # Keep the existing bounded retries for transient toolchain download failures.
      run: |
        before_markers=$(mktemp)
        after_markers=$(mktemp)
        trap 'rm -f "${before_markers}" "${after_markers}"' EXIT
        change_detection_uncertain=false
        if ! python3 scripts/ci/prek_cache_markers.py "${HOME}/.cache/prek" "${before_markers}"; then
          echo "Could not snapshot prek installation metadata before installation" >&2
          change_detection_uncertain=true
        fi

        started_at=${SECONDS}
        max_attempts=4
        for attempt in $(seq 1 "${max_attempts}"); do
          if prek install-hooks; then
            installation_succeeded=true
            break
          fi
          if [[ "${attempt}" -eq "${max_attempts}" ]]; then
            break
          fi
          delay=$((attempt * 20))
          echo "prek install-hooks failed (attempt ${attempt}/${max_attempts}), retrying in ${delay}s"
          sleep "${delay}"
        done
        if [[ "${installation_succeeded:-false}" != "true" ]]; then
          echo "installation-succeeded=false" >> "${GITHUB_OUTPUT}"
          echo "cache-changed=false" >> "${GITHUB_OUTPUT}"
          echo "change-detection-uncertain=${change_detection_uncertain}" >> "${GITHUB_OUTPUT}"
          echo "prek install-hooks failed after ${max_attempts} attempts" >&2
          exit 1
        fi

        cache_changed=false
        if ! python3 scripts/ci/prek_cache_markers.py "${HOME}/.cache/prek" "${after_markers}"; then
          echo "Could not snapshot prek installation metadata after installation" >&2
          change_detection_uncertain=true
        elif [[ "${change_detection_uncertain}" != "true" ]]; then
          if ! cmp -s "${before_markers}" "${after_markers}"; then
            cache_changed=true
          fi
        fi
        echo "installation-succeeded=true" >> "${GITHUB_OUTPUT}"
        echo "cache-changed=${cache_changed}" >> "${GITHUB_OUTPUT}"
        echo "change-detection-uncertain=${change_detection_uncertain}" >> "${GITHUB_OUTPUT}"
        echo "duration-seconds=$((SECONDS - started_at))" >> "${GITHUB_OUTPUT}"
      working-directory: ${{ github.workspace }}
    - name: "Show prek log"
      shell: bash
      run: cat ~/.cache/prek/prek.log || true
      if: always()
    - name: "Decide whether to refresh prek cache"
      id: cache-policy
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        SAVE_CACHE: ${{ inputs.save-cache }}
        STASH_HIT: ${{ steps.restore-prek-cache.outputs.stash-hit }}
        TAR_RESTORED: ${{ steps.restore-prek-tar.outputs.tar-restored }}
        INSTALLATION_SUCCEEDED: ${{ steps.install-hooks.outputs.installation-succeeded }}
        CACHE_CHANGED: ${{ steps.install-hooks.outputs.cache-changed }}
        CHANGE_DETECTION_UNCERTAIN: ${{ steps.install-hooks.outputs.change-detection-uncertain }}
      run: |
        SAVE=false
        REASON=unchanged
        if [[ "${SAVE_CACHE}" != "true" ]]; then
          REASON=reader
        elif [[ "${INSTALLATION_SUCCEEDED}" != "true" ]]; then
          REASON=installation-failed
        elif [[ "${STASH_HIT}" != "true" ]]; then
          SAVE=true
          REASON=cache-miss
        elif [[ "${TAR_RESTORED}" != "true" ]]; then
          SAVE=true
          REASON=extraction-failed
        elif [[ "${CACHE_CHANGED}" == "true" ]]; then
          SAVE=true
          REASON=cache-repaired
        elif [[ "${EVENT_NAME}" == "schedule" ]]; then
          SAVE=true
          REASON=scheduled-republication
        elif [[ "${CHANGE_DETECTION_UNCERTAIN}" == "true" ]]; then
          SAVE=true
          REASON=change-detection-uncertain
        fi
        echo "save=${SAVE}" >> "${GITHUB_OUTPUT}"
        echo "reason=${REASON}" >> "${GITHUB_OUTPUT}"
    - name: "Prepare .tar file from prek cache"
      id: archive-prek
      run: |
        started_at=${SECONDS}
        # Preserve permissions and links. Prefer bounded parallel compression when available;
        # the gzip fallback requires no additional package installation on a cold runner.
        if command -v pigz >/dev/null 2>&1; then
          compressor=(pigz -1 -p 4)
        else
          compressor=(gzip -1)
        fi
        tar -C "${HOME}" -cf - .cache/prek | "${compressor[@]}" > /tmp/cache-prek.tar.gz
        echo "duration-seconds=$((SECONDS - started_at))" >> "${GITHUB_OUTPUT}"
      shell: bash
      if: steps.cache-policy.outputs.save == 'true'
    - name: "Save prek cache"
      uses: apache/infrastructure-actions/stash/save@61dcea11f19e2bbe1263f14d72235e8da17d3ad0  # save/v1.0.0
      with:
        key: ${{ steps.cache-key.outputs.key }}
        path: /tmp/cache-prek.tar.gz
        if-no-files-found: 'error'
        retention-days: '2'
        # The payload is already gzip-compressed. Recompressing it only adds CPU time.
        compression-level: '0'
      if: steps.cache-policy.outputs.save == 'true'
    - name: "Summarize prek cache preparation"
      if: always()
      shell: bash
      env:
        CACHE_KEY: ${{ steps.cache-key.outputs.key }}
        STASH_HIT: ${{ steps.restore-prek-cache.outputs.stash-hit }}
        TAR_RESTORED: ${{ steps.restore-prek-tar.outputs.tar-restored }}
        RESTORE_SECONDS: ${{ steps.restore-prek-tar.outputs.duration-seconds }}
        INSTALL_SECONDS: ${{ steps.install-hooks.outputs.duration-seconds }}
        ARCHIVE_SECONDS: ${{ steps.archive-prek.outputs.duration-seconds }}
        CACHE_SAVED: ${{ steps.cache-policy.outputs.save }}
        SAVE_REASON: ${{ steps.cache-policy.outputs.reason }}
        CACHE_CHANGED: ${{ steps.install-hooks.outputs.cache-changed }}
        CHANGE_DETECTION_UNCERTAIN: ${{ steps.install-hooks.outputs.change-detection-uncertain }}
      run: |
        {
          printf '### Prek cache preparation\n\n'
          printf 'Cache key: `%s`\n\n' "${CACHE_KEY}"
          printf '| Phase | Result |\n| --- | --- |\n'
          printf '| Stash hit | %s |\n' "${STASH_HIT:-not run}"
          printf '| Archive restored | %s |\n' "${TAR_RESTORED:-not run}"
          printf '| Extract (seconds) | %s |\n' "${RESTORE_SECONDS:-not run}"
          printf '| Validate/install (seconds) | %s |\n' "${INSTALL_SECONDS:-not run}"
          printf '| Installation metadata changed | %s |\n' "${CACHE_CHANGED:-not run}"
          printf '| Change detection uncertain | %s |\n' "${CHANGE_DETECTION_UNCERTAIN:-not run}"
          printf '| Compress (seconds) | %s |\n' "${ARCHIVE_SECONDS:-not run}"
          printf '| Cache refresh selected | %s |\n' "${CACHE_SAVED:-not run}"
          printf '| Save reason | %s |\n' "${SAVE_REASON:-not run}"
        } >> "${GITHUB_STEP_SUMMARY}"
