---
name: 'Load image (CI or PROD)'
description: >
  Loads the current image for one Python version: from the CI image snapshot when it fits this
  runner's daemon, otherwise from the image stash.
inputs:
  python:
    description: 'Python version of the image to load'
    required: true
  platform:
    description: 'Platform of the image - linux/amd64 or linux/arm64'
    required: true
  image-type:
    description: 'Which image type to load (ci/prod)'
    default: "ci"
  image-stash-ref:
    description: 'Ref whose image stash to restore (empty = the per-branch one)'
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    # The metadata is a few bytes, so a snapshot that cannot fit is rejected before its download.
    # A pattern, unlike a name, downloads nothing without an error when the builder made no snapshot.
    # Self-hosted runners restore the stash from their own storage, which a run artifact cannot beat.
    - name: "Download CI image snapshot metadata ${{ inputs.platform }}:${{ inputs.python }}"
      id: snapshot-meta
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        pattern: >-
          ci-image-snapshot-v1-${{ inputs.python }}-${{
          inputs.platform == 'linux/amd64' && 'amd64' || 'arm64' }}-meta
        merge-multiple: true
        path: "/mnt/"
      if: >
        github.event_name == 'pull_request' && runner.environment == 'github-hosted' &&
        inputs.image-type == 'ci' && inputs.image-stash-ref == ''
    - name: "Check CI image snapshot ${{ inputs.platform }}:${{ inputs.python }}"
      id: snapshot-check
      env:
        PLATFORM: ${{ inputs.platform }}
        PYTHON: ${{ inputs.python }}
      run: |
        if ./scripts/ci/docker_data_root_snapshot.sh check \
            "/mnt/ci-image-snapshot-${PLATFORM//\//_}-${PYTHON}.tar.zst"; then
          echo "fits=true" >> "${GITHUB_OUTPUT}"
        else
          echo "Falling back to loading the image stash"
        fi
      shell: bash
      if: steps.snapshot-meta.outcome == 'success'
    - name: "Download CI image snapshot ${{ inputs.platform }}:${{ inputs.python }}"
      id: snapshot-download
      continue-on-error: true
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: >-
          ci-image-snapshot-v1-${{ inputs.python }}-${{
          inputs.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
        path: "/mnt/"
      if: steps.snapshot-check.outputs.fits == 'true'
    # Falls back to the image stash below whenever the snapshot cannot be restored.
    - name: "Unpack CI image snapshot ${{ inputs.platform }}:${{ inputs.python }}"
      id: snapshot
      env:
        PLATFORM: ${{ inputs.platform }}
        PYTHON: ${{ inputs.python }}
      run: |
        if breeze ci-image load --platform "${PLATFORM}" --python "${PYTHON}" \
            --snapshot-file "/mnt/ci-image-snapshot-${PLATFORM//\//_}-${PYTHON}.tar.zst"; then
          echo "restored=true" >> "${GITHUB_OUTPUT}"
        else
          echo "Falling back to loading the image stash"
        fi
      shell: bash
      if: steps.snapshot-download.outcome == 'success'
    - name: >
        Restore ${{ inputs.image-type }} docker image ${{ inputs.platform }}:${{ inputs.python }}
        ${{ inputs.image-stash-ref != '' && format('built for ref {0}', inputs.image-stash-ref) || '' }}
      uses: ./.github/actions/stash-restore
      with:
        key: "${{ inputs.image-type }}-image-save-v3-${{ inputs.platform }}-${{ inputs.python }}\
          ${{ inputs.image-stash-ref != '' && format('-{0}', inputs.image-stash-ref) || '' }}"
        path: "/mnt/"
        # Must stay true: runs on RunsOn (canaries and release-branch pushes) save these image
        # stashes as S3 digests only.
        only-current-branch: 'true'
        fail-on-download: 'true'
      if: steps.snapshot.outputs.restored != 'true'
    - name: "Load ${{ inputs.image-type }} image ${{ inputs.platform }}:${{ inputs.python }}"
      env:
        PLATFORM: ${{ inputs.platform }}
        PYTHON: ${{ inputs.python }}
        IMAGE_TYPE: ${{ inputs.image-type }}
      run: >
        breeze ${IMAGE_TYPE}-image load --platform "${PLATFORM}" --python "${PYTHON}" --image-file-dir "/mnt"
      shell: bash
      if: steps.snapshot.outputs.restored != 'true'
