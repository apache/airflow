---
name: 'Prepare breeze && current image (CI or PROD)'
description: 'Installs breeze and recreates current python image from artifact'
inputs:
  python:
    description: 'Python version for image to prepare'
    required: true
  image-type:
    description: 'Which image type to prepare (ci/prod)'
    default: "ci"
  platform:
    description: 'Platform for the build - linux/amd64 or linux/arm64'
    required: true
  use-uv:
    description: 'Whether to use uv'
    required: true
  make-mnt-writeable-and-cleanup:
    description: 'Whether to cleanup /mnt'
    required: true
  min-free-space-gb:
    description: >
      Skip removing the runner's unused pre-installed tooling when the root filesystem already has
      at least this many GB free, in the units df --block-size=1G reports. Empty always removes.
      The default clears today's runners (86 free on ubuntu-22.04, 110 on ubuntu-22.04-arm) with
      room over the heaviest measured footprint of a job that prepares an image, 24 for a full CI
      image build, so a runner shipping less free space brings the removal back on its own.
    required: false
    default: "60"
  image-stash-ref:
    description: >
      Ref whose image stash to restore (empty = the per-branch one). An image built for a ref
      other than the branch tip is stashed under a key of its own by ci-image-build.yml.
    required: false
    default: ""
outputs:
  host-python-version:
    description: Python version used in host
    value: ${{ steps.breeze.outputs.host-python-version }}
runs:
  using: "composite"
  steps:
    - name: "Make /mnt writeable and cleanup"
      shell: bash
      run: ./scripts/ci/make_mnt_writeable.sh
      if: inputs.make-mnt-writeable-and-cleanup == 'true'
    - name: "Free up disk space"
      shell: bash
      env:
        MIN_FREE_SPACE_GB: ${{ inputs.min-free-space-gb }}
      run: |
        FREE_GB=$(df --output=avail --block-size=1G / | tail -1 | tr -d ' ')
        if [[ -n "${MIN_FREE_SPACE_GB}" && "${FREE_GB}" -ge "${MIN_FREE_SPACE_GB}" ]]; then
          echo "${FREE_GB} GB free on / (>= ${MIN_FREE_SPACE_GB} GB), skipping the disk cleanup"
        else
          ./scripts/tools/free_up_disk_space.sh
        fi
    - name: "Install Breeze"
      uses: ./.github/actions/breeze
      id: breeze
    - name: "Check free space"
      shell: bash
      run: |
        echo "Checking free space!"
        df -H
    - name: >
        Restore ${{ inputs.image-type }} docker image ${{ inputs.platform }}:${{ inputs.python }}
        ${{ inputs.image-stash-ref != '' && format('built for ref {0}', inputs.image-stash-ref) || '' }}
      uses: ./.github/actions/stash-s3-restore
      with:
        key: "${{ inputs.image-type }}-image-save-v3-${{ inputs.platform }}-${{ inputs.python }}\
          ${{ inputs.image-stash-ref != '' && format('-{0}', inputs.image-stash-ref) || '' }}"
        path: "/mnt/"
        only-current-branch: 'true'
        fail-on-download: 'true'
    - name: "Load ${{ inputs.image-type }} image ${{ inputs.platform }}:${{ inputs.python }}"
      env:
        PLATFORM: ${{ inputs.platform }}
        PYTHON: ${{ inputs.python }}
        IMAGE_TYPE: ${{ inputs.image-type }}
      run: >
        breeze ${IMAGE_TYPE}-image load --platform "${PLATFORM}" --python "${PYTHON}" --image-file-dir "/mnt"
      shell: bash
