# Docker Compose override for the yaml_dag E2E test mode.
#
# The Dag is a YAML file in the Dags folder, so nothing extra is needed to parse
# it beyond the importer registered in the .env file. Its "run:" task is a stub
# routed to the Go coordinator, which is why the worker listens on the "golang"
# queue and the packed Go bundle is mounted where the coordinator scans for it
# (the same arrangement go.yml makes; see its comments for the USER / HOME ones).
---
services:
  airflow-worker:
    environment:
      USER: airflow
      HOME: /home/airflow
    volumes:
      - ./go-bundles:/opt/airflow/go-bundles:ro
    command: celery worker -q golang,default
