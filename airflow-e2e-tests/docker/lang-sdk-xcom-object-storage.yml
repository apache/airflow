# Docker Compose override for lang_sdk_xcom_object_storage E2E test mode, listed after
# localstack.yml and ts.yml.
#
# One image runs the Dag definitions of all three language SDKs. It is the airflow-java-worker image
# conftest builds (see java.yml), and ts.yml adds the node binary and the TypeScript bundle mount.
# The Go and Java bundles sit in the Dags folder, which the Dag processor and the worker both mount.
# The worker consumes the "typescript", "golang" and "java-native" queues that the Dags set.
# USER and HOME are set for the statically linked Go bundle, as in go.yml.
---
services:
  airflow-dag-processor:
    image: airflow-java-worker
    environment:
      USER: airflow
      HOME: /home/airflow

  airflow-worker:
    image: airflow-java-worker
    environment:
      USER: airflow
      HOME: /home/airflow
    command: celery worker -q typescript,golang,java-native,default
