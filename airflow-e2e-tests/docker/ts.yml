# Docker Compose override for ts_sdk E2E test mode.
#
# The stock Airflow image ships no Node.js runtime, so node-provider copies the
# node binary from the same image conftest builds the bundle with into a
# shared volume. The bundle and the runtime are mounted on the worker and the
# Dag processor, which runs the bundle to check the stub tasks of the example
# Dags against the task handlers it registers. The worker consumes the
# "typescript" queue where @task.stub tasks are routed.
---
services:
  node-provider:
    image: ${NODE_IMAGE:-node:22-slim}
    command: ["cp", "/usr/local/bin/node", "/opt/nodejs/node"]
    volumes:
      - nodejs-bin:/opt/nodejs

  airflow-dag-processor:
    volumes:
      - ./ts-bundles:/opt/airflow/ts-bundles:ro
      - nodejs-bin:/opt/nodejs:ro
    depends_on:
      node-provider:
        condition: service_completed_successfully

  airflow-worker:
    volumes:
      - ./ts-bundles:/opt/airflow/ts-bundles:ro
      - nodejs-bin:/opt/nodejs:ro
    command: celery worker -q typescript,default
    depends_on:
      node-provider:
        condition: service_completed_successfully

volumes:
  nodejs-bin:
