#
# Worker pod template for the "java" queue (JavaCoordinator).
#
# The coordinator downloads the java-task-handlers Dag bundle when the task starts.
# It is an S3DagBundle over the localstack ``java-artifacts`` bucket, and the base
# container gets the connection for it. The base image is the prod image plus a
# headless JRE (built from Dockerfile.java) so the JavaCoordinator can exec
# ``java``. The Go queue uses the plain prod image. Image placeholders are rendered
# by ``breeze k8s setup-lang-sdk-test``.
---
kind: Pod
apiVersion: v1
metadata:
  name: placeholder-name-dont-delete
  namespace: placeholder-name-dont-delete
spec:
  containers:
    - name: base
      image: __LANG_SDK_JAVA_IMAGE__
      env:
        - name: AIRFLOW__CORE__EXECUTOR
          value: LocalExecutor
        - name: AIRFLOW_HOME
          value: /opt/airflow
        - name: AIRFLOW__CORE__DAGS_FOLDER
          value: /opt/airflow/dags
        - name: AIRFLOW__CORE__FERNET_KEY
          valueFrom:
            secretKeyRef:
              name: airflow-fernet-key
              key: fernet-key
        - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
          valueFrom:
            secretKeyRef:
              name: airflow-metadata
              key: connection
        - name: AIRFLOW_CONN_AWS_LOCALSTACK
          valueFrom:
            secretKeyRef:
              name: lang-sdk-aws-conn
              key: uri
      volumeMounts:
        - name: airflow-logs
          mountPath: /opt/airflow/logs
        - name: airflow-config
          readOnly: true
          mountPath: /opt/airflow/airflow.cfg
          subPath: airflow.cfg
        - name: airflow-config
          readOnly: true
          mountPath: /opt/airflow/config/airflow_local_settings.py
          subPath: airflow_local_settings.py
      imagePullPolicy: IfNotPresent
  volumes:
    - name: airflow-logs
      emptyDir: {}
    - name: airflow-config
      configMap:
        name: airflow-config
        defaultMode: 420
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  serviceAccountName: airflow-worker-kubernetes
  serviceAccount: airflow-worker-kubernetes
  securityContext:
    runAsUser: 50000
    fsGroup: 50000
  schedulerName: default-scheduler
