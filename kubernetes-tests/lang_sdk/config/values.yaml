#
# Helm overrides for the lang-SDK KubernetesExecutor system test. Applied with
# `helm ... -f` by `breeze k8s setup-lang-sdk-test` (which also renders the
# pod-template image placeholders and creates the lang-sdk-aws-conn secret).
---
executor: KubernetesExecutor

# A global AWS connection pointing at the in-cluster localstack S3, used by the
# dag-processor (to pull the Python stub Dag bundle) and by the artifact
# init-containers. Sourced from the secret the breeze command creates.
extraEnv: |
  - name: AIRFLOW_CONN_AWS_LOCALSTACK
    valueFrom:
      secretKeyRef:
        name: lang-sdk-aws-conn
        key: uri

# The KubernetesExecutor lives in the scheduler and reads each coordinator's
# pod_template_file from disk, so mount the rendered templates (configmap created
# by the breeze command) into the scheduler at the path referenced below.
scheduler:
  extraVolumes:
    - name: lang-sdk-pod-templates
      configMap:
        name: lang-sdk-pod-templates
  extraVolumeMounts:
    - name: lang-sdk-pod-templates
      readOnly: true
      mountPath: /opt/airflow/lang_sdk/pod_templates

# Serve BOTH the baked-in example Dags (dags-folder) and the lang-SDK stub Dag pulled from the
# localstack "dags" bucket. This must be additive: the standard KubernetesExecutor tests share this
# run and trigger example Dags, so dropping dags-folder marks them stale and their runs 404.
# Configure it here (dagProcessor.dagBundleConfigList) rather than overriding
# config.dag_processor.dag_bundle_config_list directly -- the chart renders the config from this and
# it is the recommended, drift-safe path.
#
# go-task-handlers / java-task-handlers are the coordinators' task_handler_bundle_name bundles: an
# init container stages each artifact bucket into these paths (stage_artifacts.py), in the worker
# pods and in the dag-processor pod. The dag-processor runs the Go binary and the Java jar to check
# the stub tasks of lang_sdk_combined.py against the task handlers they register, so it runs on the
# Java worker image (breeze sets images.airflow to it, and pins the task pods' default image back to
# the plain prod image), and finds no Dag files in these bundles.
dagProcessor:
  dagBundleConfigList:
    - name: dags-folder
      classpath: "airflow.dag_processing.bundles.local.LocalDagBundle"
      kwargs: {}
    - name: lang-sdk-dags
      classpath: "airflow.providers.amazon.aws.bundles.s3.S3DagBundle"
      kwargs:
        bucket_name: "dags"
        aws_conn_id: "aws_localstack"
    - name: go-task-handlers
      classpath: "airflow.dag_processing.bundles.local.LocalDagBundle"
      kwargs:
        path: "/opt/airflow/artifacts/go-artifacts"
    - name: java-task-handlers
      classpath: "airflow.dag_processing.bundles.local.LocalDagBundle"
      kwargs:
        path: "/opt/airflow/artifacts/java-artifacts"
  # The same staging as the worker pod templates' init containers. The chart renders these values
  # as templates, so the image is the dag-processor's own.
  extraInitContainers:
    - name: stage-go-bundle
      image: '{{ template "airflow_image" . }}'
      imagePullPolicy: IfNotPresent
      command: ["python", "/opt/airflow/lang_sdk/stage_artifacts.py"]
      env:
        - name: AIRFLOW_HOME
          value: /opt/airflow
        - name: ARTIFACT_BUNDLE_NAME
          value: go-artifacts
        - name: STAGE_CHMOD_EXEC
          value: "true"
        - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_STORAGE_PATH
          value: /opt/airflow/artifacts
        - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST
          value: >-
            [{"name": "go-artifacts",
              "classpath": "airflow.providers.amazon.aws.bundles.s3.S3DagBundle",
              "kwargs": {"bucket_name": "go-artifacts", "aws_conn_id": "aws_localstack"}}]
        - name: AIRFLOW_CONN_AWS_LOCALSTACK
          valueFrom:
            secretKeyRef:
              name: lang-sdk-aws-conn
              key: uri
      volumeMounts:
        - name: lang-sdk-artifacts
          mountPath: /opt/airflow/artifacts
        - name: lang-sdk-scripts
          readOnly: true
          mountPath: /opt/airflow/lang_sdk
    - name: stage-java-jar
      image: '{{ template "airflow_image" . }}'
      imagePullPolicy: IfNotPresent
      command: ["python", "/opt/airflow/lang_sdk/stage_artifacts.py"]
      env:
        - name: AIRFLOW_HOME
          value: /opt/airflow
        - name: ARTIFACT_BUNDLE_NAME
          value: java-artifacts
        - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_STORAGE_PATH
          value: /opt/airflow/artifacts
        - name: AIRFLOW__DAG_PROCESSOR__DAG_BUNDLE_CONFIG_LIST
          value: >-
            [{"name": "java-artifacts",
              "classpath": "airflow.providers.amazon.aws.bundles.s3.S3DagBundle",
              "kwargs": {"bucket_name": "java-artifacts", "aws_conn_id": "aws_localstack"}}]
        - name: AIRFLOW_CONN_AWS_LOCALSTACK
          valueFrom:
            secretKeyRef:
              name: lang-sdk-aws-conn
              key: uri
      volumeMounts:
        - name: lang-sdk-artifacts
          mountPath: /opt/airflow/artifacts
        - name: lang-sdk-scripts
          readOnly: true
          mountPath: /opt/airflow/lang_sdk
  extraVolumes:
    - name: lang-sdk-artifacts
      emptyDir: {}
    - name: lang-sdk-scripts
      configMap:
        name: lang-sdk-scripts
        defaultMode: 420
  extraVolumeMounts:
    - name: lang-sdk-artifacts
      mountPath: /opt/airflow/artifacts

config:
  # Route the golang/java queues to their coordinators, each carrying an
  # extra.pod_template_file (per-coordinator pod templates) so the worker pod is
  # launched from a coordinator-specific template that stages the artifact and,
  # for Java, runs on the JVM-bearing image. The java-sdk extra takes that image from
  # images.airflow, which breeze sets to --java-image, so the Java task pods run on the
  # image the Airflow components run on. The chart renders config values with tpl.
  sdk:
    # Single-line JSON: airflow.cfg is an ini file, so a value with embedded
    # newlines would break the rendered configmap.
    # yamllint disable-line rule:line-length
    coordinators: '{"go-sdk": {"classpath": "airflow.sdk.coordinators.executable.ExecutableCoordinator", "kwargs": {"task_handler_bundle_name": "go-task-handlers"}, "extra": {"pod_template_file": "/opt/airflow/lang_sdk/pod_templates/lang_sdk_golang.yaml"}}, "java-sdk": {"classpath": "airflow.sdk.coordinators.java.JavaCoordinator", "kwargs": {"task_handler_bundle_name": "java-task-handlers"}, "extra": {"pod_template_file": "/opt/airflow/lang_sdk/pod_templates/lang_sdk_java.yaml", "worker_container_repository": "{{ .Values.images.airflow.repository }}", "worker_container_tag": "{{ .Values.images.airflow.tag }}"}}}'
    queue_to_coordinator: '{"golang": "go-sdk", "java": "java-sdk"}'
