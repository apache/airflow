---
package-name: apache-airflow-providers-dbt-core
name: dbt Core
description: |
    Run `dbt Core <https://github.com/dbt-labs/dbt-core>`__ jobs in a single Kubernetes pod.

state: ready
versions:
  - 1.0.0

# Hard dependencies. Amazon (S3) and Google (GCS) are declared as optional
# extras below instead of hard deps: they are only needed when uploading
# ``target/`` artifacts and are imported lazily by the operator.
dependencies:
  - apache-airflow>=2.9.0
  - apache-airflow-providers-cncf-kubernetes>=8.0.0

additional-extras:
  - name: amazon
    dependencies:
      - apache-airflow-providers-amazon>=8.0.0
  - name: google
    dependencies:
      - apache-airflow-providers-google>=10.0.0

integrations:
  - integration-name: dbt Core
    external-doc-url: https://docs.getdbt.com/docs/introduction
    how-to-guide:
      - /docs/operators/dbt.rst
    tags:
      - software

operators:
  - integration-name: dbt Core
    python-modules:
      - airflow.providers.dbt.core.operators.dbt
