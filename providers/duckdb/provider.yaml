---
package-name: apache-airflow-providers-duckdb
name: DuckDB

state: ready
lifecycle: incubation
source-date-epoch: 1788600000
description: |
  `DuckDB <https://duckdb.org/>`__ provider for Apache Airflow. Runs SQL against an in-process
  DuckDB database — in memory, backed by a local file, or hosted by MotherDuck — and manages
  extension loading and resource limits so Dag authors only supply the SQL.
# Note that those versions are maintained by release manager - do not update them manually
# with the exception of case where other provider in sources has >= new provider version.
# In such case adding >= NEW_VERSION and bumping to NEW_VERSION in a provider have
# to be done in the same PR
versions:
  - 0.1.0

integrations:
  - integration-name: DuckDB
    external-doc-url: https://duckdb.org/
    how-to-guide:
      - /docs/apache-airflow-providers-duckdb/operators.rst
    tags: [software]

hooks:
  - integration-name: DuckDB
    python-modules:
      - airflow.providers.duckdb.hooks.duckdb

operators:
  - integration-name: DuckDB
    python-modules:
      - airflow.providers.duckdb.operators.duckdb

connection-types:
  - hook-class-name: airflow.providers.duckdb.hooks.duckdb.DuckDBHook
    hook-name: "DuckDB"
    connection-type: duckdb
    ui-field-behaviour:
      hidden-fields:
        - login
        - port
      relabeling:
        host: Database path
        schema: MotherDuck database
        password: MotherDuck token
      placeholders:
        host: "/tmp/analytics.duckdb (leave empty for an in-memory database)"
        extra: '{"extensions": ["httpfs"], "memory_limit": "2GB", "threads": 4}'
