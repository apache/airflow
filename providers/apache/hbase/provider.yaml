---
package-name: apache-airflow-providers-apache-hbase
name: Apache HBase
description: |
    `Apache HBase <https://hbase.apache.org/>`__

state: ready
lifecycle: production
source-date-epoch: 1768557443
# note that those versions are maintained by release manager - do not update them manually
versions:
  - 1.1.0
  - 1.0.0

integrations:
  - integration-name: HBase
    external-doc-url: https://hbase.apache.org/
    how-to-guide:
      - /docs/apache-airflow-providers-apache-hbase/operators.rst
      - /docs/apache-airflow-providers-apache-hbase/sensors.rst
      - /docs/apache-airflow-providers-apache-hbase/hooks.rst
      - /docs/apache-airflow-providers-apache-hbase/connections.rst
    tags: [apache, software]

operators:
  - integration-name: HBase
    python-modules:
      - airflow.providers.apache.hbase.operators.hbase

sensors:
  - integration-name: HBase
    python-modules:
      - airflow.providers.apache.hbase.sensors.hbase

hooks:
  - integration-name: HBase
    python-modules:
      - airflow.providers.apache.hbase.hooks.hbase
      - airflow.providers.apache.hbase.hooks.hbase_cli
      - airflow.providers.apache.hbase.hooks.hbase_strategy

connection-types:
  - hook-class-name: airflow.providers.apache.hbase.hooks.hbase.HBaseThriftHook
    connection-type: hbase
    ui-field-behaviour:
      hidden-fields:
        - schema
      relabeling:
        host: HBase Thrift2 Server Host
        port: HBase Thrift2 Server Port
      placeholders:
        host: localhost
        port: "9090"
        extra: |
          {
            "ssl_options": {
              "ca_certs": "/path/to/ca.crt",
              "cert_file": "/path/to/client.crt",
              "key_file": "/path/to/client.key",
              "validate": true
            },
            "auth_method": "GSSAPI",
            "kerberos_service_name": "hbase",
            "timeout": 30000,
            "retry_max_attempts": 3,
            "retry_delay": 1.0,
            "retry_backoff_factor": 2.0,
            "connection_pool": {
              "enabled": false,
              "size": 10,
              "timeout": 30
            }
          }
  - hook-class-name: airflow.providers.apache.hbase.hooks.hbase_cli.HBaseCLIHook
    connection-type: hbase
