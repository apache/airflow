---
package-name: apache-airflow-providers-apache-ozone
name: Apache Ozone
description: |
  `Apache Ozone <https://ozone.apache.org/>`__

  Provider package for interacting with Apache Ozone via:

  - Native CLI (``ozone``) for ``ofs://`` / ``o3fs://`` paths
  - Native Ozone administration and filesystem workflows

state: not-ready
lifecycle: incubation
source-date-epoch: 1751688000
# note that those versions are maintained by release manager - do not update them manually
versions:
  - 0.1.0

integrations:
  - integration-name: Apache Ozone
    external-doc-url: https://ozone.apache.org/
    tags: [apache]

hooks:
  - integration-name: Apache Ozone
    python-modules:
      - airflow.providers.apache.ozone.hooks.ozone

operators:
  - integration-name: Apache Ozone
    python-modules:
      - airflow.providers.apache.ozone.operators.ozone

sensors:
  - integration-name: Apache Ozone
    python-modules:
      - airflow.providers.apache.ozone.sensors.ozone

transfers:
  - source-integration-name: Hadoop Distributed File System (HDFS)
    target-integration-name: Apache Ozone
    python-module: airflow.providers.apache.ozone.transfers.hdfs_to_ozone
  - source-integration-name: Apache Ozone
    target-integration-name: Apache Ozone
    python-module: airflow.providers.apache.ozone.transfers.ozone_backup

connection-types:
  - hook-class-name: airflow.providers.apache.ozone.hooks.ozone.OzoneCliHook
    hook-name: "Ozone"
    connection-type: ozone
    ui-field-behaviour:
      hidden-fields:
        - schema
      relabeling:
        host: Ozone OM Host
        port: Ozone OM Port
      placeholders:
        host: ozone-om
        port: "9862"
        extra: >-
          {"ozone_security_enabled": "true",
          "hadoop_security_authentication": "kerberos",
          "kerberos_principal": "user@REALM",
          "kerberos_keytab": "/opt/airflow/keytabs/user.keytab",
          "krb5_conf": "/opt/airflow/kerberos-config/krb5.conf",
          "ozone_conf_dir": "/opt/airflow/ozone-conf"}
