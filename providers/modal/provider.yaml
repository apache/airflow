---
package-name: apache-airflow-providers-modal

name: Modal

description: |
    `Modal <https://modal.com/>`__ provider for Apache Airflow.
    Owns the ``modal`` connection type and a hook that turns it into an authenticated
    Modal client, so operators, toolsets and executors share one credential path.

state: ready
lifecycle: incubation
source-date-epoch: 1789930588

# Note that those versions are maintained by release manager - do not update them manually
versions:
  - 0.1.0

integrations:
  - integration-name: Modal
    external-doc-url: https://modal.com/docs
    logo: /docs/integration-logos/Modal.png
    tags:
      - ai

hooks:
  - integration-name: Modal
    python-modules:
      - airflow.providers.modal.hooks.modal

connection-types:
  - hook-class-name: airflow.providers.modal.hooks.modal.ModalHook
    hook-name: "Modal"
    connection-type: modal
    conn-fields:
      environment:
        label: Environment
        schema:
          type:
            - string
            - 'null'
        description: >-
          Modal environment to scope lookups and sandboxes to (for example main or dev).
          Leave empty to let the Modal SDK resolve it from MODAL_ENVIRONMENT or the active
          profile in ~/.modal.toml.
    ui-field-behaviour:
      hidden-fields:
        - host
        - schema
        - port
      relabeling:
        login: Token ID
        password: Token Secret
      placeholders:
        login: ak-...
        password: as-...
        extra: '{"environment": "main"}'
