---
package-name: apache-airflow-providers-sas
name: SAS
description: |
    `SAS <https://www.sas.com/>`__

state: not-ready
lifecycle: incubation
source-date-epoch: 1793836800
# Note that those versions are maintained by release manager - do not update them manually
# with the exception of case where other provider in sources has >= new provider version.
# In such case adding >= NEW_VERSION and bumping to NEW_VERSION in a provider have
# to be done in the same PR
versions:
  - 1.0.0

integrations:
  - integration-name: SAS
    external-doc-url: https://documentation.sas.com/doc/en/pgmsascdc/9.4_3.5/sqlproc/titlepage.htm
    tags: [software]

dialects:
  - dialect-type: sas
    dialect-class-name: airflow.providers.sas.dialects.sas.SASDialect

hooks:
  - integration-name: SAS
    python-modules:
      - airflow.providers.sas.hooks.sas

connection-types:
  - hook-class-name: airflow.providers.sas.hooks.sas.SASHook
    connection-type: sas
    hook-name: "SAS"
    ui-field-behaviour:
      hidden-fields:
        - schema
      relabeling:
        host: SAS Server (SSH host)
        port: SSH Port
        login: Username
        password: Password
      placeholders:
        host: sas-server.example.com
        port: "22"
        login: sas_user
        extra: |
          {
            "sas_binary": "/opt/sas/SASFoundation/9.4/sas",
            "sas_libraries": {"mylib": "/data/mylib"},
            "sas_temp_dir": "/tmp",
            "encoding": "iso-8859-15",
            "keepalive_interval": 30
          }
