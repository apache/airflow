---
package-name: apache-airflow-providers-islo
name: Islo
description: |
  `Islo <https://islo.dev/>`__ provider for Apache Airflow. The ``IsloExecutor`` runs each
  task try in its own ephemeral Islo sandbox and supports OCI images and snapshot-based startup.
state: ready
lifecycle: incubation
source-date-epoch: 1783849718
versions:
  - 0.1.0

integrations:
  - integration-name: Islo
    external-doc-url: https://docs.islo.dev/
    how-to-guide:
      - /docs/apache-airflow-providers-islo/islo-executor.rst
    tags: [service]

hooks:
  - integration-name: Islo
    python-modules:
      - airflow.providers.islo.hooks.islo

connection-types:
  - hook-class-name: airflow.providers.islo.hooks.islo.IsloHook
    hook-name: Islo
    connection-type: islo
    conn-fields:
      compute_url:
        label: Compute API URL
        schema:
          type:
            - string
            - 'null'
          format: url
          default: https://ca.compute.islo.dev
        description: Islo compute-plane API base URL.
      request_timeout:
        label: Request timeout
        schema:
          type:
            - number
            - 'null'
          exclusiveMinimum: 0
          default: 30
        description: API request timeout in seconds.
      max_retries:
        label: Maximum retries
        schema:
          type:
            - integer
            - 'null'
          minimum: 0
          default: 3
        description: Retries for idempotent API requests after throttling or transient failures.
    ui-field-behaviour:
      hidden-fields:
        - schema
        - port
        - login
      relabeling:
        password: Access Key
        host: Control API URL
      placeholders:
        host: https://api.islo.dev
        password: ak_...
        extra: '{"compute_url": "https://ca.compute.islo.dev", "request_timeout": 30, "max_retries": 3}'

executors:
  - airflow.providers.islo.executors.islo_executor.IsloExecutor

config:
  islo:
    description: IsloExecutor configuration.
    options:
      conn_id:
        description: Airflow connection containing the Islo access key and API endpoints.
        type: string
        version_added: 0.1.0
        example: islo_default
        default: islo_default
      default_image:
        description: Default OCI image. Configure exactly one default image or snapshot source.
        type: string
        version_added: 0.1.0
        example: ghcr.io/example/airflow-sandbox:3.3.0
        default: ~
      default_snapshot_name:
        description: Default Islo snapshot name used for fast sandbox forks.
        type: string
        version_added: 0.1.0
        example: airflow-runtime
        default: ~
      default_snapshot_url:
        description: Default OCI-compatible snapshot URL used for sandbox forks.
        type: string
        version_added: 0.1.0
        example: ~
        default: ~
      default_vcpus:
        description: Default virtual CPU count.
        type: integer
        version_added: 0.1.0
        example: '2'
        default: ~
      default_memory_mb:
        description: Default memory in MiB.
        type: integer
        version_added: 0.1.0
        example: '4096'
        default: ~
      default_disk_gb:
        description: Default writable disk size in GiB.
        type: integer
        version_added: 0.1.0
        example: '20'
        default: ~
      default_timeout_seconds:
        description: Default command deadline hint in seconds.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '3600'
      default_ttl_seconds:
        description: Hard sandbox lifetime used to clean up resources after scheduler failures.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '86400'
      default_workdir:
        description: Default working directory inside the sandbox.
        type: string
        version_added: 0.1.0
        example: /opt/airflow
        default: ~
      default_gateway_profile:
        description: Default Islo gateway profile for secret isolation and egress policy.
        type: string
        version_added: 0.1.0
        example: airflow-restricted
        default: ~
      internet_enabled:
        description: Whether sandboxes receive network access. The Execution API must be reachable.
        type: boolean
        version_added: 0.1.0
        example: ~
        default: 'True'
      creation_batch_size:
        description: Maximum launch futures accepted from one scheduler heartbeat.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '128'
      launch_concurrency:
        description: Maximum concurrent sandbox create, execute, and delete API operations.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '32'
      status_batch_size:
        description: Maximum outstanding execution status requests.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '1000'
      status_concurrency:
        description: Maximum concurrent execution status API requests.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '128'
      poll_interval:
        description: Base execution status polling interval in seconds.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '2'
      max_poll_interval:
        description: Maximum polling interval after transient API errors.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '30'
      check_health_on_startup:
        description: Check Islo API credentials before the scheduler starts processing tasks.
        type: boolean
        version_added: 0.1.0
        example: ~
        default: 'True'
      health_check_timeout:
        description: Startup health-check deadline in seconds.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '30'
      adoption_timeout:
        description: Deadline for concurrently fencing launch-phase sandboxes during adoption.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '30'
      shutdown_timeout:
        description: Deadline for fencing unfinished launches during executor shutdown.
        type: integer
        version_added: 0.1.0
        example: ~
        default: '60'
